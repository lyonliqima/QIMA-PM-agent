<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Access Control · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== QSP / ACA design tokens (Figma: QSP Sandbox 2025) ===== */
:root{
  /* Neutral */
  --carbon:#191919;--seal:#737373;--smoke:#B3B3B3;--pearl:#DEDEDE;
  --line:#E6E6E6;--mist:#F0F0F0;--cloud:#F7F7F7;--white:#fff;
  --nav-active:#EAEAEA;--header-line:#D6D6D6;
  /* Accent · Pool */
  --pool-100:#E6ECFB;--pool-200:#D3DCF8;--pool-500:#4169E1;--pool-600:#1E46BD;--pool-900:#153184;
  /* Semantic */
  --kiwi-050:#EAF6F2;--kiwi-500:#00A876;--kiwi-900:#006648;
  --cherry-050:#FDEFEF;--cherry-500:#E5353D;--cherry-900:#9E141B;
  --mango-050:#FCF2E6;--mango-500:#F58F00;--mango-900:#B26309;
  /* Brand */
  --qima-red:#E4002B;--peach:#FF8261;
  /* Radii · per DS: 4 chip / 6 nav / 8 control / 16 container */
  --r-chip:4px;--r-nav:6px;--r-ctl:8px;--r-card:16px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,0,0,1);--dur:200ms;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*:not(textarea)::-webkit-scrollbar{width:8px;height:8px}
*:not(textarea)::-webkit-scrollbar-thumb{border-radius:8px;background:var(--pearl)}
*:not(textarea)::-webkit-scrollbar-thumb:hover{background:var(--smoke)}
body{min-height:100vh;font:400 14px/20px var(--font);color:var(--carbon);background:var(--cloud);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;background:none;border:0}

/* ===== app header · 72px ===== */
.appbar{position:sticky;z-index:900;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:var(--white);box-shadow:inset 0 -1px 0 var(--header-line)}
.appbar-l{display:flex;align-items:center;gap:16px;padding-left:4px;min-width:0}
.wordmark{display:flex;align-items:flex-end;gap:12px}
.wordmark .qima{height:20px;width:auto;display:block}
.wordmark .suffix{font:400 20px/20px var(--font);letter-spacing:2px;color:var(--pool-600)}
.appbar-r{display:flex;align-items:center;gap:16px}
.env{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border-radius:var(--r-ctl);color:var(--carbon);font:400 14px/20px var(--font);white-space:nowrap;transition:background var(--dur) var(--ease)}
.env:hover{background:var(--cloud)}
.env .dot{width:8px;height:8px;border-radius:50%;background:var(--kiwi-500)}
.env svg{width:20px;height:20px;color:var(--seal)}
.divider-v{width:1px;height:36px;background:var(--pearl)}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-ctl);color:var(--carbon);transition:background var(--dur) var(--ease)}
.iconbtn:hover{background:var(--pool-100)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--pool-100);color:var(--pool-500)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--peach);color:var(--white);display:grid;place-items:center;font:600 12px/12px var(--font);text-transform:uppercase}

/* ===== layout ===== */
.layout{display:grid;grid-template-columns:116px minmax(0,1fr);min-height:calc(100vh - 72px)}

/* left rail · icon + label, 116px */
.rail{position:sticky;top:72px;height:calc(100vh - 72px);background:var(--cloud);box-shadow:inset -1px 0 0 var(--line);padding:16px 8px;overflow-y:auto}
.rail-items{display:flex;flex-direction:column;gap:12px;align-items:center}
.rail-items button{width:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;border-radius:var(--r-nav);color:var(--seal);font:400 12px/16px var(--font);text-align:center;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.rail-items button svg{width:16px;height:16px;flex:none}
.rail-items button:hover{background:var(--mist);color:var(--carbon)}
.rail-items button.active{background:var(--nav-active);color:var(--carbon)}
.rail-group{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}

.col{min-width:0;display:flex;flex-direction:column;background:var(--white)}

/* ===== page bar (sticky under app header) ===== */
.pagebar{position:sticky;top:72px;z-index:100;background:var(--white);box-shadow:inset 0 -1px 0 var(--line);padding:12px 24px}
.pagebar-row{display:flex;align-items:center;gap:8px;min-height:36px}
.pagebar h1{font:600 16px/20px var(--font);color:var(--carbon);white-space:nowrap}
.pagebar .grow{flex:1;min-width:0}
.pagebar .tools{display:flex;align-items:center;gap:8px}
.crumbs{display:flex;align-items:center;gap:12px;font:400 16px/20px var(--font);color:var(--carbon);min-width:0}
.crumbs .sep{color:var(--carbon)}
.crumbs .cur{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs a{color:var(--carbon);text-decoration:none;cursor:pointer}
.crumbs a:hover{color:var(--pool-500)}
.counter{position:relative;display:inline-flex}
.counter[data-n]::after{content:attr(data-n);position:absolute;z-index:1;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pool-500);color:var(--white);font:400 11px/18px var(--font);text-align:center;box-shadow:0 0 0 2px var(--white)}

/* ===== tabs (used by in-card sub tabs) ===== */
.tab{padding:8px 12px;font:400 14px/20px var(--font);color:var(--seal);border-bottom:2px solid transparent;transition:color var(--dur) var(--ease)}
.tab:hover{color:var(--carbon)}
.tab.active{color:var(--carbon);border-bottom-color:var(--pool-500)}

/* ===== buttons · h36 / r8 / 14px regular ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:8px 16px;border-radius:var(--r-ctl);background:var(--white);border:1px solid var(--pearl);color:var(--carbon);font:400 14px/20px var(--font);white-space:nowrap;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.btn:hover{background:var(--cloud)}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--pool-500);border-color:var(--pool-500);color:var(--white)}
.btn-primary:hover{background:var(--pool-600);border-color:var(--pool-600)}
.btn-secondary{background:var(--pool-100);border-color:transparent;color:var(--pool-500);padding:8px 12px}
.btn-secondary:hover{background:var(--pool-200)}
.btn-tertiary{background:transparent;border-color:transparent;color:var(--pool-500);padding:8px 12px}
.btn-tertiary:hover{background:var(--pool-100)}
.btn-danger{background:var(--cherry-050);border-color:transparent;color:var(--cherry-900);padding:8px 12px}
.btn-danger:hover{background:#fbe2e3}
.btn-icon{width:36px;padding:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ===== fields · label 12/16 + control h36 r8 border smoke ===== */
.field{display:flex;flex-direction:column;gap:4px}
.field > label{font:400 12px/16px var(--font);color:var(--carbon)}
.field input,.field select,.field textarea{width:100%;height:36px;padding:0 16px;border:1px solid var(--smoke);border-radius:var(--r-ctl);background:var(--white);font:400 14px/20px var(--font);color:var(--carbon);outline:0}
.field select{cursor:pointer;padding-right:40px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23191919' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M6 9.5l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:20px 20px}
.field textarea{height:auto;min-height:76px;padding:8px 16px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--smoke)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pool-500);box-shadow:0 0 0 3px var(--pool-100)}
.field input:disabled{background:var(--mist);color:var(--seal)}
.field .hint{font:400 12px/16px var(--font);color:var(--seal)}

/* ===== list filters (all views) ===== */
.filterbar{margin:0 0 16px}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 12px;align-items:end}
.filters .field-clear .btn{height:36px}

/* ===== audit feed (history) ===== */
.audit-feed{display:flex;flex-direction:column;gap:0;padding:4px 24px 8px;max-width:920px}
.audit-item{display:grid;grid-template-columns:28px 1fr;gap:0 14px;padding:0}
.audit-rail{position:relative;display:flex;justify-content:center}
.audit-rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--pearl)}
.audit-item:first-child .audit-rail::before{top:18px}
.audit-item:last-child .audit-rail::before{bottom:calc(100% - 18px)}
.audit-dot{position:relative;z-index:1;width:12px;height:12px;margin-top:16px;border-radius:50%;background:var(--pool-500);box-shadow:0 0 0 3px var(--white)}
.audit-dot.v-bind,.audit-dot.v-add,.audit-dot.v-create{background:var(--pool-500)}
.audit-dot.v-update{background:var(--mango-500,#E8A317)}
.audit-dot.v-remove{background:var(--cherry-500,#E24B4A)}
.audit-dot.v-copy{background:var(--kiwi-500,#2A9B7A)}
.audit-card{margin:6px 0 10px;padding:14px 16px;border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--cloud);min-width:0}
.audit-card:hover{border-color:var(--pool-200);background:var(--white)}
.audit-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.audit-top .audit-time{margin-left:auto;font:400 12px/16px var(--font);color:var(--seal);white-space:nowrap}
.badge-verb{border:0;font-weight:600}
.badge-verb.v-bind,.badge-verb.v-add,.badge-verb.v-create{background:var(--pool-100);color:var(--pool-900)}
.badge-verb.v-update{background:var(--mango-050);color:var(--mango-900)}
.badge-verb.v-remove{background:var(--cherry-050);color:var(--cherry-900)}
.badge-verb.v-copy{background:var(--kiwi-050);color:var(--kiwi-900)}
.audit-title{font:600 14px/20px var(--font);color:var(--carbon);margin:0 0 4px}
.audit-code{display:inline-block;max-width:100%;margin:4px 0 8px;padding:4px 8px;border-radius:6px;background:var(--white);border:1px solid var(--pearl);font:500 12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--pool-900);word-break:break-all}
.audit-foot{display:flex;flex-wrap:wrap;gap:8px 16px;font:400 12px/16px var(--font);color:var(--seal)}
.audit-foot b{font-weight:600;color:var(--carbon)}
.audit-empty{padding:48px 24px;text-align:center;color:var(--seal)}
@media (max-width:900px){
  .audit-top .audit-time{margin-left:0;width:100%}
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seg{display:flex;border:1px solid var(--smoke);border-radius:var(--r-ctl);overflow:hidden;height:36px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px;font:400 14px/20px var(--font);color:var(--seal);cursor:pointer;background:var(--white);box-shadow:inset -1px 0 0 var(--pearl)}
.seg label:last-child{box-shadow:none}
.seg input{display:none}
.seg input:checked+label{background:var(--pool-100);color:var(--pool-500)}

/* ===== content ===== */
.content{flex:1;padding:20px 24px 40px;min-width:0;background:var(--white)}
/* list pages: full-bleed table, no bottom padding so pager sits flush */
.content-list{padding-bottom:0}
.table-block{margin:0 -24px}

/* ===== collapsible container card ===== */
.card{background:var(--white);border:1px solid var(--pearl);border-radius:var(--r-card);margin-bottom:16px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 16px 6px 24px;background:var(--pool-100);cursor:pointer}
.card-head .chev{width:20px;height:20px;flex:none;color:var(--pool-900);transition:transform var(--dur) var(--ease)}
.card.collapsed .card-head .chev{transform:rotate(-90deg)}
.card-head h3{flex:1;min-width:0;font:400 14px/20px var(--font);color:var(--pool-900)}
.card-head .acts{display:flex;align-items:center;gap:8px}
.card-head .acts .btn-tertiary:hover,.card-head .acts .btn-secondary:hover{background:var(--pool-200)}
.card-body{padding:16px 24px}
.card.collapsed .card-body,.card.collapsed .subtabs{display:none}
.card-body.flush{padding:0}

/* key/value */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px 24px}
.kv-item{display:flex;flex-direction:column;gap:4px;min-width:0}
.kv-item .k{font:400 12px/16px var(--font);color:var(--seal)}
.kv-item .v{font:400 14px/20px var(--font);color:var(--carbon);word-break:break-word}
.kv-item .v:has(.keyfield){min-width:0;overflow:hidden}
/* secret-ish value: masked by default, reveal + copy inline — keep value + actions on one row */
.keyfield{display:flex;align-items:center;flex-wrap:nowrap;gap:4px;min-width:0;max-width:100%}
.keyfield code{flex:1 1 auto;min-width:0;font:400 13px/20px var(--mono,var(--font));color:var(--carbon);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
.keyfield code.masked{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbtn{flex:0 0 24px;width:24px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent;color:var(--seal);cursor:pointer;transition:background .12s,color .12s}
.kbtn:hover{background:var(--cloud);color:var(--carbon)}
.kbtn:focus-visible{outline:2px solid var(--focus,var(--kiwi-500));outline-offset:1px}
.kbtn svg{width:15px;height:15px}

/* ===== table · header 48 / row 52 ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{height:48px;padding:0 8px;background:var(--white);box-shadow:inset 0 -1px 0 var(--line);font:600 14px/20px var(--font);color:var(--carbon);text-align:left;white-space:nowrap}
thead th:first-child{padding-left:24px}
thead th:last-child{padding-right:24px}
tbody td{height:52px;padding:6px 8px;border-bottom:1px solid var(--pearl);font:400 14px/20px var(--font);color:var(--seal);vertical-align:middle}
tbody td:first-child{padding-left:24px}
tbody td:last-child{padding-right:24px}
tbody tr{transition:background var(--dur) var(--ease)}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--cloud)}
tbody tr:last-child td{border-bottom:0}
.cell-link{font:600 14px/20px var(--font);color:var(--pool-500);text-decoration:underline;text-underline-position:from-font}
.strong{font-weight:600;color:var(--carbon)}
.muted{color:var(--seal)}

/* ===== badges & chips ===== */
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);font:600 12px/16px var(--font);color:var(--pool-500);white-space:nowrap}
.badge-kiwi{color:var(--kiwi-900);background:var(--kiwi-050);border-color:#BFE3D8}
.badge-cherry{color:var(--cherry-900);background:var(--cherry-050);border-color:#F5CACC}
.badge-mango{color:var(--mango-900);background:var(--mango-050);border-color:#F3DBB9}
.badge-grey{color:var(--seal);background:var(--mist);border-color:var(--pearl)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.count{display:inline-flex;align-items:center;justify-content:center;height:20px;min-width:24px;padding:0 6px;border-radius:var(--r-chip);background:var(--mist);font:400 12px/16px var(--font);color:var(--carbon)}
.roles-cell{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0;cursor:default}
.roles-cell .roles-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 14px/20px var(--font);color:var(--carbon);max-width:140px}
.roles-cell .roles-more{flex:none;height:20px;min-width:28px;padding:0 6px;border-radius:var(--r-chip);background:var(--pool-100);font:600 12px/20px var(--font);color:var(--pool-900);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);font:400 12px/16px var(--font);color:var(--carbon);white-space:nowrap}
.chip .x{color:var(--seal);cursor:pointer;font-size:14px;line-height:1}
.chip .x:hover{color:var(--cherry-500)}
.chip-link{color:var(--pool-500);cursor:pointer;font-weight:600}
.chip-link:focus-visible,.chip-add:focus-visible{outline:2px solid var(--pool-500);outline-offset:2px}
.chip-add{border-style:dashed;border-color:var(--pool-200);background:var(--pool-100);color:var(--pool-500);cursor:pointer}
.chip-add:hover{background:var(--pool-200)}

/* ===== permission board · module column → page cards → actions ===== */
.perm-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.perm-col{border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);overflow:hidden;min-width:0}
.perm-col-head{min-height:44px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--cloud);box-shadow:inset 0 -1px 0 var(--pearl);font:600 13px/18px var(--font);color:var(--carbon);flex-wrap:wrap}
.perm-col-head .mod-acts{display:flex;flex-wrap:wrap;gap:4px 10px;width:100%;margin-top:2px;padding-left:24px}
.perm-col-head .mod-acts label,.perm-col-head .mod-acts .perm-act{min-height:28px;padding:2px 0;font:400 12px/16px var(--font)}
.perm-tree{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:12px;background:var(--white)}
.perm-page{border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--cloud);overflow:hidden;min-width:0}
.perm-page-head{min-height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--white);box-shadow:inset 0 -1px 0 var(--pearl);font:600 13px/18px var(--font);color:var(--carbon)}
.perm-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px;padding:8px}
.perm-act{min-height:34px;display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:var(--r-nav);color:var(--seal);font:400 13px/18px var(--font);cursor:default}
.perm-act.interactive{cursor:pointer}
.perm-act.interactive:hover{background:var(--pool-100);color:var(--pool-900)}
.perm-act input{width:16px;height:16px;flex:none;margin-top:1px;accent-color:var(--pool-500)}
.perm-act .act-label{flex:1;min-width:0}
.perm-act .act-code{display:block;margin-top:2px;font:400 11px/14px var(--font);color:var(--smoke);word-break:break-all}
.perm-board-empty{padding:24px;text-align:center;color:var(--seal);font:400 13px/18px var(--font)}
.perm-col[hidden],.perm-page[hidden]{display:none!important}

/* ===== API resources · flat endpoint list ===== */
.api-list{border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);overflow:hidden}
.api-row{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 12px;box-shadow:inset 0 -1px 0 var(--pearl)}
.api-row:last-child{box-shadow:none}
.api-row.interactive{cursor:pointer}
.api-row.interactive:hover{background:var(--pool-100)}
.api-row input{width:16px;height:16px;flex:none;accent-color:var(--pool-500)}
.api-method{flex:none;min-width:44px;height:20px;padding:0 6px;border-radius:var(--r-chip);background:var(--mist);font:600 11px/20px var(--font);color:var(--seal);text-align:center;letter-spacing:.02em}
.api-path{flex:1;min-width:0;font:400 13px/18px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--carbon);word-break:break-all}
.api-row[hidden]{display:none!important}
.modal.wide{max-width:960px}
.modal.wide .modal-body{max-height:70vh}

/* ===== pagination · h56 ===== */
.pager{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;padding:0 24px;box-shadow:inset 0 1px 0 var(--line);font:400 14px/20px var(--font);color:var(--seal)}
.pager-nav{display:flex;align-items:center;gap:4px}
.pager-nav button{min-width:32px;height:32px;padding:0 8px;border-radius:var(--r-ctl);color:var(--carbon);font:400 14px/20px var(--font)}
.pager-nav button:hover{background:var(--pool-100)}
.pager-nav button.active{background:var(--pool-500);color:var(--white)}
.pager-nav button:disabled{color:var(--smoke);cursor:not-allowed}
.pager-nav button:disabled:hover{background:none}

/* ===== sub tabs inside a card ===== */
.subtabs{display:flex;align-items:center;gap:0;padding:0 24px;box-shadow:inset 0 -1px 0 var(--line);overflow-x:auto}
.subpane{display:none}
.subpane.active{display:block}

/* ===== timeline ===== */
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--pearl)}
.tl-item{position:relative;padding:0 0 16px 8px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--white);border:2px solid var(--pool-500)}
.tl-time{font:400 12px/16px var(--font);color:var(--seal)}
.tl-act{font:600 14px/20px var(--font);color:var(--carbon);margin:2px 0}
.tl-meta{font:400 12px/16px var(--font);color:var(--seal)}

/* ===== resource tree ===== */
.tree{font:400 14px/20px var(--font)}
.tree .row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-nav);cursor:pointer;color:var(--carbon)}
.tree .row:hover{background:var(--cloud)}
.tree .caret{width:14px;color:var(--seal)}
.tree-children{margin-left:11px;padding-left:12px;box-shadow:inset 1px 0 0 var(--pearl)}

/* ===== modal ===== */
.overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:64px 16px;background:rgba(25,25,25,.42);overflow-y:auto}
.overlay.show{display:flex}
.modal{width:100%;max-width:600px;background:var(--white);border-radius:var(--r-card);overflow:hidden;box-shadow:0 8px 32px rgba(25,25,25,.2)}
.modal-head{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px 10px 24px;box-shadow:inset 0 -1px 0 var(--line)}
.modal-head h3{flex:1;font:600 16px/20px var(--font);color:var(--carbon)}
.modal-body{padding:20px 24px;max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 24px;box-shadow:inset 0 1px 0 var(--line)}
.note{padding:12px 16px;border-radius:var(--r-ctl);background:var(--pool-100);color:var(--pool-900);font:400 12px/18px var(--font)}
/* lazy-loaded section placeholder — heavy sections stay collapsed until opened */
.skel{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.skel i{display:block;height:12px;border-radius:4px;background:linear-gradient(90deg,var(--mist),var(--cloud),var(--mist));background-size:200% 100%;animation:sh 1.1s linear infinite}
.skel i:nth-child(2){width:72%}.skel i:nth-child(3){width:48%}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* search-select: master data lives in another service, so pick, never type freely */
.picker{position:relative}
.picker-list{margin-top:6px;border:1px solid var(--smoke);border-radius:var(--r-ctl);overflow:hidden;max-height:200px;overflow-y:auto}
.picker-list button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 16px;background:var(--white);border:0;cursor:pointer;text-align:left;font:400 14px/20px var(--font);color:var(--carbon)}
.picker-list button+button{box-shadow:inset 0 1px 0 var(--line)}
.picker-list button:hover{background:var(--pool-050,#F5F8FF)}
.picker-list button span{color:var(--seal);font:400 12px/16px var(--font);margin-left:auto}
.picker-list button.on{background:var(--pool-100);color:var(--pool-900)}
.picker-list button .meta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.picker-list button .meta b{font:600 14px/20px var(--font);color:inherit}
.picker-list button .meta em{font:400 12px/16px var(--font);color:var(--seal);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker-list button .meta .roles{color:var(--pool-500)}
.picker-empty{padding:16px;text-align:center;color:var(--seal);font:400 13px/18px var(--font)}
.secret{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--smoke);border-radius:var(--r-ctl);background:var(--cloud);font:400 13px/20px var(--mono,var(--font));color:var(--carbon);word-break:break-all}
.secret button{margin-left:auto;flex:none}

/* ===== empty ===== */
.empty{padding:48px 24px;text-align:center;color:var(--seal);font:400 14px/20px var(--font)}

/* list table: header sticks under the page bar while scrolling long lists.
   sticky resolves against the nearest scrollport, so the list table must not
   create its own overflow container — the page scrolls instead. */
.content-list .table-wrap{overflow:visible}
.content-list thead th{position:sticky;z-index:5;top:var(--sticky-top,132px)}
th.sortable{cursor:pointer;user-select:none;transition:color var(--dur) var(--ease)}
th.sortable:hover{color:var(--pool-500)}
th .sort-ind{margin-left:6px;font-size:11px;color:var(--smoke)}
th.sorted{color:var(--pool-500)}
th.sorted .sort-ind{color:var(--pool-500)}
table.tbl-history th:last-child,table.tbl-history td.col-action{min-width:240px;width:34%;white-space:normal}
tbody tr.clickable:focus-visible{outline:2px solid var(--pool-500);outline-offset:-2px;background:var(--cloud)}

/* pagination extras */
.pager-left{display:flex;align-items:center;gap:12px;min-width:0}
.pg-size{height:32px;padding:0 28px 0 8px;border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);color:var(--carbon);font:400 14px/20px var(--font);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23191919' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M6 9.5l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center;background-size:16px 16px}
.pager-nav .ellipsis{min-width:24px;text-align:center;color:var(--smoke)}

/* checkbox list */
.checks{display:grid;gap:10px}
.checks label{display:flex;align-items:center;gap:10px;font:400 14px/20px var(--font);color:var(--carbon);cursor:pointer}
.checks input{width:16px;height:16px;accent-color:var(--pool-500)}

.subpane-toolbar{margin-bottom:12px}
code.res-code{font:400 12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--seal);word-break:break-all}
.iso-tree{display:flex;flex-direction:column;gap:8px}
.iso-dim{border:1px solid var(--pearl);border-radius:var(--r-ctl);overflow:hidden}
.iso-dim-head{min-height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--cloud);font:600 13px/18px var(--font);color:var(--carbon)}
.iso-dim-head .count{margin-left:auto}
.iso-opt{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 28px;box-shadow:inset 0 1px 0 var(--pearl);font:400 14px/20px var(--font);color:var(--carbon)}
.iso-opt input[type=checkbox]{width:16px;height:16px;accent-color:var(--pool-500)}
.iso-edit{display:flex;flex-direction:column;gap:12px}
.iso-dim-head input.iso-dim-name{flex:1;min-width:0;height:32px;padding:0 8px;border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);font:600 13px/18px var(--font);color:var(--carbon)}
.iso-opt input.iso-opt-name{flex:1;min-width:0;height:32px;padding:0 8px;border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);font:400 14px/20px var(--font);color:var(--carbon)}
.iso-opt input.iso-opt-desc,.iso-opt .iso-opt-desc{flex:1.2;min-width:0;color:var(--seal)}
.iso-opt input.iso-opt-desc{height:32px;padding:0 8px;border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);font:400 13px/20px var(--font);color:var(--seal)}
.iso-opt .iso-opt-desc:not(input){margin-left:auto;text-align:right}
.iso-dim-foot{padding:8px 12px;box-shadow:inset 0 1px 0 var(--pearl)}
.iso-edit-actions{padding-top:4px}
.iconbtn.iso-rm{width:28px;height:28px;flex:none;color:var(--seal);font-size:18px;line-height:1}
.iconbtn.iso-rm:hover{color:var(--cherry-900);background:var(--cherry-050)}
.role-pick{display:flex;flex-direction:column;gap:12px}
#role-pick-list{display:flex;flex-direction:column;gap:12px}
.role-mod{border:1px solid var(--pearl);border-radius:var(--r-ctl);overflow:hidden}
.role-mod-head{min-height:36px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--cloud);font:600 13px/18px var(--font);color:var(--carbon)}
.role-mod-head .count{margin-left:auto}
.role-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;box-shadow:inset 0 1px 0 var(--pearl);cursor:pointer}
.role-opt:hover{background:var(--pool-100)}
.role-opt input{width:16px;height:16px;margin-top:2px;accent-color:var(--pool-500);flex:none}
.role-opt .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.role-opt .meta b{font:600 14px/20px var(--font);color:var(--carbon)}
.role-opt .meta em{font:400 12px/16px var(--font);color:var(--seal);font-style:normal}
.sel-bar{padding:12px;border:1px dashed var(--pearl);border-radius:var(--r-ctl);background:var(--cloud)}
.sel-bar .k{font:400 12px/16px var(--font);color:var(--seal);margin-bottom:8px}

/* ===== toast ===== */
.toasts{position:fixed;z-index:1200;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:560px;padding:10px 16px;border-radius:var(--r-ctl);background:var(--carbon);color:var(--white);font:400 14px/20px var(--font);box-shadow:0 6px 24px rgba(25,25,25,.24);animation:toast-in var(--dur) var(--ease);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--pool-500);flex:none}
.toast.ok .dot{background:var(--kiwi-500)}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.modal-open{overflow:hidden}

/* ===== narrow screens ===== */
@media (max-width:1100px){
  .layout{grid-template-columns:64px minmax(0,1fr)}
  .rail-items button{width:48px;gap:0;padding:12px 0;font-size:0}
  .rail-items button svg{width:20px;height:20px}
  .grid-2{grid-template-columns:1fr}
  .env{max-width:220px;overflow:hidden}
}
@media (max-width:760px){
  .appbar{padding:12px 16px}
  .pagebar,.content{padding-left:16px;padding-right:16px}
  .table-block{margin:0 -16px}
  .filters{grid-template-columns:1fr}
  .pager{padding:0 16px}
}
</style>

/* Human labels for auth2 resource segments — hide the colon soup in the UI */
const SEG_LABEL={
 REPORTGENERATION:'Report Generation',TA:'Test Assignment',TESTSETUP:'Test Setup',
 TEMPLATE:'Template',DASHBOARD:'Dashboard',TODOLIST:'To-Do List',INFO:'Info',
 FIRSTPAGE:'First Page',RESULTTABLE:'Result Table',DEPARTMENT:'Department',
 CONFIRMPARAMETERS:'Confirm Parameters',EDITSPECIMEN:'Edit Specimen',
 GENERATEBREAKDOWNLIST:'Generate Breakdown List',TEST:'Test',TESTMETHOD:'Test Method',
 PARAMETERS:'Parameters',MASTERDATA:'Master Data',GENERALINFO:'General Info',
 LABINFO:'Lab Info',PARAMETERINFO:'Parameter Info',AIMSTOLABS:'AIMS → Labs',PAGE:'Page',
 VIEW:'view',EDIT:'edit',APPROVER:'approve',UNLOCK:'unlock',ADMIN:'admin',
 ADDSPECIMEN:'add specimen',EXPORTBREAKDOWNCHECKLIST:'export checklist'
};
function prettySeg(s){
 if(!s)return '';
 if(SEG_LABEL[s])return SEG_LABEL[s];
 return s.toLowerCase().replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}
/* Split codes like TESTSETUP:PAGE:TEST:GENERALINFO:VIEW → module / page / action */
function parseWebCode(code){
 const parts=String(code).split(':').filter(Boolean);
 if(!parts.length)return {page:'Other',action:code,code,root:'Other',rootKey:'_',moduleLevel:false};
 const ACTIONS=new Set(['VIEW','EDIT','APPROVER','UNLOCK','ADMIN','ADDSPECIMEN','EXPORTBREAKDOWNCHECKLIST']);
 const rootKey=parts[0];
 const root=prettySeg(rootKey);
 let action=parts[parts.length-1];
 let pageParts=parts.slice(0,-1);
 if(!ACTIONS.has(action)&&parts.length===1){action='access';pageParts=parts;}
 pageParts=pageParts.filter(p=>p!=='PAGE');
 if(!pageParts.length)pageParts=[rootKey];
 /* ROOT:VIEW / ROOT:ADMIN (no :PAGE:) → module-level header actions, not a peer page card */
 const hadPage=parts.includes('PAGE');
 const moduleLevel=!hadPage&&pageParts.length===1&&pageParts[0]===rootKey;
 let page=null;
 if(!moduleLevel){
  if(pageParts.length>=3)page=prettySeg(pageParts[pageParts.length-2])+' · '+prettySeg(pageParts[pageParts.length-1]);
  else if(pageParts.length===2&&pageParts[0]!==pageParts[1])page=prettySeg(pageParts[1]);
  else page=prettySeg(pageParts[pageParts.length-1]);
 }
 return {page,action:prettySeg(action),code,root,rootKey,moduleLevel};
}
const COMMON_ROOTS=new Set(['INFO','LOG','INSTRUCTION']);
function groupByModule(codes){
 const map=new Map();
 (codes||[]).forEach(code=>{
  const p=parseWebCode(code);
  const isCommon=COMMON_ROOTS.has(p.rootKey);
  const key=isCommon?'_common':p.rootKey;
  const label=isCommon?t('commonPages'):p.root;
  if(!map.has(key))map.set(key,{key,label,moduleActions:[],pages:new Map()});
  const col=map.get(key);
  if(p.moduleLevel){col.moduleActions.push(p);return;}
  const pageName=p.page||prettySeg(p.rootKey);
  if(!col.pages.has(pageName))col.pages.set(pageName,{page:pageName,actions:[]});
  col.pages.get(pageName).actions.push(p);
 });
 const order=['TA','REPORTGENERATION','TESTSETUP','TEMPLATE','DASHBOARD','TODOLIST','_common'];
 return [...map.values()]
  .map(c=>({key:c.key,label:c.label,moduleActions:c.moduleActions,pages:[...c.pages.values()]}))
  .sort((a,b)=>{
   const ia=order.indexOf(a.key),ib=order.indexOf(b.key);
   return (ia<0?99:ia)-(ib<0?99:ib);
  });
}
function roleBoundCodes(role,all){
 if(!all||!all.length)return [];
 const n=(role.name||'').toLowerCase();
 if(/admin/.test(n))return all.slice();
 const hits=[];
 if(/first-?page/.test(n))hits.push('FIRSTPAGE');
 if(/result.?table|resulttable/.test(n))hits.push('RESULTTABLE');
 if(/department/.test(n))hits.push('DEPARTMENT');
 if(/confirm.?param/.test(n))hits.push('CONFIRMPARAMETERS');
 if(/specimen/.test(n))hits.push('EDITSPECIMEN');
 if(/breakdown/.test(n))hits.push('GENERATEBREAKDOWNLIST');
 if(/template/.test(n))hits.push('TEMPLATE');
 if(/test-?assignment|test assignment/.test(n)&&!hits.length)hits.push('TA','CONFIRMPARAMETERS','EDITSPECIMEN','GENERATEBREAKDOWNLIST');
 if(/test-?setup|test setup/.test(n))hits.push('TESTSETUP','TEST','TESTMETHOD','PARAMETERS','MASTERDATA');
 if(/viewer/.test(n)&&!hits.length)return all.filter(c=>/:VIEW$/.test(c)||c.endsWith(':VIEW'));
 let bound=hits.length?all.filter(c=>hits.some(h=>c.includes(h))):all.slice(0,Math.min(all.length,role.web||4));
 if(/approver/.test(n)&&!/editor|admin/.test(n))bound=bound.filter(c=>!/:(EDIT|ADDSPECIMEN)$/.test(c));
 if(/editor/.test(n)&&!/approver|admin/.test(n))bound=bound.filter(c=>!/:APPROVER$/.test(c));
 if(/viewer/.test(n)&&!/admin|editor|approver/.test(n))bound=bound.filter(c=>/:VIEW$/.test(c));
 const rootView=all.find(c=>/^[^:]+:VIEW$/.test(c));
 if(rootView&&!bound.includes(rootView))bound=[rootView,...bound];
 return [...new Set(bound)];
}

function applyIsoConfig(){
 isoEditSyncFromDom();
 const mod=DATA.module[isoEdit.idx];
 if(!mod)return;
 const taken=[];
 const draft=isoEdit.draft.map(d=>{
  const name=(d.name||'').trim();
  if(!name)return null;
  const seen=new Map();
  (d.options||[]).map(normIsoOpt).forEach(o=>{
   if(!o.value)return;
   seen.set(o.value.toLowerCase(),o);
  });
  const options=[...seen.values()];
  const id=d.id||isoDimSlug(name,taken);
  taken.push(id);
  return {id,name,options};
 }).filter(Boolean);
 const names=draft.map(d=>d.name.toLowerCase());
 if(new Set(names).size!==names.length){toast(t('isoDupDim'));return;}
 for(const d of draft){
  if(!d.options.length){toast(t('isoOptRequired',{dim:d.name}));return;}
  const opts=d.options.map(o=>isoOptValue(o).toLowerCase());
  if(new Set(opts).size!==opts.length){toast(t('isoDupOpt',{dim:d.name}));return;}
 }
 const validKeys=new Set();
 draft.forEach(d=>d.options.forEach(o=>validKeys.add(`${d.name}::${isoOptValue(o)}`)));
 DATA.role.forEach(r=>{
  if(r.module!==mod.name)return;
  r.dataOpts=(r.dataOpts||[]).filter(x=>validKeys.has(`${x.dim}::${x.opt}`));
 });
 ISO[mod.name]=draft;
 DATA.history.unshift({time:stampNow(),actor:'it@qima.com',type:'module',action:'Updated data isolation options',object:mod.name,sourceId:mod.id});
 const idx=isoEdit.idx;
 closeModal();
 renderDetail('module',idx);
 toast(t('saved',{what:t('m.isoConfig')}),'ok');
}

/* AccessKey id is public but long — mask the random tail, keep reveal + copy at hand */
function maskKey(s){
 const cut=s.lastIndexOf('_')+1, head=s.slice(0,cut), tail=s.slice(cut);
 if(tail.length<=8)return s;
 return head+'••••'+tail.slice(-4);
}

  <code class="masked" data-full="${escAttr(v)}" data-mask="${escAttr(maskKey(v))}">${escHtml(maskKey(v))}</code>
  ${iconBtn(SVG.eye,t('revealKey'),'toggleKey(this)','kbtn')}
  ${iconBtn(SVG.copy,t('copy'),`copyText(this,'${escAttr(v)}')`,'kbtn')}
 </div>`;
}
function toggleKey(btn){
 const code=btn.parentNode.querySelector('code'), on=code.classList.contains('masked');
 code.classList.toggle('masked',!on);
 code.textContent=on?code.dataset.full:code.dataset.mask;
 btn.innerHTML=on?SVG.eyeOff:SVG.eye;
 const label=on?t('hideKey'):t('revealKey');
 btn.title=label;btn.setAttribute('aria-label',label);
}

const LIST_STATE={};
function st(view){return LIST_STATE[view]||(LIST_STATE[view]={page:1,size:10,q:'',sort:null,filters:{},hidden:[]});}

const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
/* '23-Jul-2026 14:32' / '12-May-2026' → sortable + comparable number */
function dnum(s){
 if(!s)return 0;
 const str=String(s);
 if(/^\d{4}-\d{2}-\d{2}/.test(str)){
  const t=Date.parse(str.replace(' ','T'));
  return isNaN(t)?0:t;
 }
 const [d,t]=str.split(' ');
 const [dd,mm,yy]=d.split('-');
 const [hh,mi]=(t||'0:0').split(':');
 return new Date(+yy,MONTHS[mm]||0,+dd,+hh||0,+mi||0).getTime();
}

const COL_DEFS={
 module:[{k:'id',lk:'col.domainId'},{k:'name',lk:'col.name'},{k:'desc',lk:'col.desc',sort:false},{k:'updateTime',lk:'col.updateTime',get:r=>dnum(r.updateTime)}],
 role:[{k:'id',lk:'col.roleId'},{k:'name',lk:'col.roleKey'},{k:'desc',lk:'col.desc',sort:false},{k:'module',lk:'col.module'}],
 user:[{k:'id',lk:'col.userId'},{k:'login',lk:'col.login'},{k:'firstName',lk:'col.firstName'},{k:'lastName',lk:'col.lastName'},{k:'email',lk:'col.email'},{k:'dept',lk:'col.dept'},{k:'office',lk:'col.office',sort:false},{k:'roles',lk:'col.roleCount',get:r=>r.roles.length}],
 customer:[{k:'id',lk:'col.akId'},{k:'client',lk:'col.customer'},{k:'login',lk:'col.login'},{k:'mode',lk:'col.mode'},{k:'status',lk:'col.status'},{k:'created',lk:'col.created',get:r=>dnum(r.created)}],
 platform:[{k:'name',lk:'platUserName'},{k:'desc',lk:'col.desc',sort:false},{k:'keys',lk:'col.keys',get:r=>(r.keys||[]).length},{k:'created',lk:'col.created',get:r=>dnum(r.created)}],
 history:[{k:'time',lk:'col.time',get:r=>dnum(r.time)},{k:'actor',lk:'col.actor'},{k:'object',lk:'col.object',sort:false},{k:'sourceId',lk:'col.sourceId'},{k:'action',lk:'col.action',sort:false}],
};
function COLS(view){return (COL_DEFS[view]||[]).map(c=>({...c,label:c.label||t(c.lk)}));}

const AK_FILTERS=[
 {k:'status',lk:'f.status',opts:[{v:'Active',l:'Active'},{v:'Suspended',l:'Suspended'}],test:(r,v)=>r.status===v},
 {k:'mode',lk:'f.mode',opts:[{v:'inherit',l:'inherit'},{v:'direct',l:'direct'}],test:(r,v)=>r.mode===v}
];
const FILTERS={
 module:[],
 role:[{k:'module',lk:'f.domain',opts:()=>DATA.module.map(m=>({v:m.name,l:m.name})),test:(r,v)=>r.module===v}],
 user:[{k:'dept',lk:'f.dept',opts:[{v:'Lab',l:'Lab'}],test:(r,v)=>r.dept===v},
  {k:'hasRole',lk:'f.roleCount',opts:[{v:'yes',lk:'hasRoles'},{v:'no',lk:'noRoles'}],test:(r,v)=>v==='yes'?r.roles.length>0:r.roles.length===0}],
 customer:AK_FILTERS,
 platform:[],
 history:[{k:'from',lk:'f.from',type:'date',test:(r,v)=>dnum(r.time)>=new Date(v+'T00:00:00').getTime()},
  {k:'to',lk:'f.to',type:'date',test:(r,v)=>dnum(r.time)<=new Date(v+'T23:59:59').getTime()},
  {k:'actor',lk:'f.actor',opts:()=>[...new Set(DATA.history.map(h=>h.actor))].map(v=>({v,l:v})),test:(r,v)=>r.actor===v},
  {k:'sourceId',lk:'f.sourceId',type:'text',test:(r,v)=>String(r.sourceId||'').toLowerCase().includes(String(v).toLowerCase())},
  {k:'type',lk:'f.objType',opts:[{v:'module',lk:'type.module'},{v:'role',lk:'type.role'},{v:'userRole',lk:'type.userRole'},{v:'ak',lk:'type.ak'}],test:(r,v)=>r.type===v}]
};
function filterOpts(d){const o=typeof d.opts==='function'?d.opts():(d.opts||[]);return o.map(x=>typeof x==='string'?{v:x,l:x}:{v:x.v,l:x.lk?t(x.lk):(x.l||x.v)});}
function visibleRows(view){
 const s=st(view), defs=FILTERS[view]||[], q=s.q.trim().toLowerCase();
 let rows=DATA[view].filter(r=>{
  if(q&&!JSON.stringify(r).toLowerCase().includes(q))return false;
  return defs.every(d=>{const v=s.filters[d.k];return v?d.test(r,v):true;});
 });
 if(s.sort){
  const c=COLS(view).find(x=>x.k===s.sort.k);
  if(c){
   const val=r=>c.get?c.get(r):r[c.k];
   rows=rows.slice().sort((a,b)=>{
    const x=val(a),y=val(b);
    const n=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'zh-Hans-CN');
    return s.sort.dir==='desc'?-n:n;
   });
  }
 }
 return rows;
}
function activeFilterCount(view){
 const s=st(view);
 return (s.q.trim()?1:0)+Object.values(s.filters).filter(Boolean).length;
}

function refreshList(){

 const cs=$('#col-style');if(cs)cs.outerHTML=colStyle(currentView);

function filterCard(view){
 const s=st(view), defs=FILTERS[view]||[], n=activeFilterCount(view);
 const ctrl=d=>{
  if(d.type==='date')return `<input type="date" value="${s.filters[d.k]||''}" onchange="setFilter('${d.k}',this.value)">`;
  if(d.type==='text')return `<input value="${escAttr(s.filters[d.k]||'')}" placeholder="${t('searchPh')}" oninput="setFilter('${d.k}',this.value)">`;
  const opts=[{v:'',l:t('all')},...filterOpts(d)];

  return `<select onchange="setFilter('${d.k}',this.value)">${opts.map(o=>`<option value="${escAttr(o.v)}"${cur===o.v?' selected':''}>${o.l}</option>`).join('')}</select>`;
 };
 return `<div class="filterbar"><div class="filters">
  ${field(t('keyword'),`<input id="q" placeholder="${t('searchPh')}" value="${escAttr(s.q)}" oninput="setQuery(this.value)">`)}

function listBody(view){

  :`<tr><td colspan="${cols.length}"><div class="empty">${t('noMatch')}${activeFilterCount(view)?`<div style="margin-top:16px">${btn(t('clearFilters'),'btn-secondary',SVG.erase,'resetFilters()')}</div>`:''}</div></td></tr>`;

function listHead(view){

 }).join('')}</tr>`;

function listPager(view,total,pages){
 const s=st(view);
 const nums=pageWindow(s.page,pages).map(p=>p==='…'
  ?'<span class="ellipsis">…</span>'
  :`<button class="${p===s.page?'active':''}" onclick="setListPage(${p})">${p}</button>`).join('');
 const from=total?(s.page-1)*s.size+1:0, to=Math.min(total,s.page*s.size);
 return `<div class="pager">
  <div class="pager-left">
   <span>${t('pagerTotal',{n:total,from,to})}</span>
   <select class="pg-size" onchange="setListSize(this.value)">${[10,20,50].map(n=>`<option value="${n}"${n===s.size?' selected':''}>${t('perPage',{n})}</option>`).join('')}</select>
  </div>
  <div class="pager-nav">
   <button ${s.page<=1?'disabled':''} onclick="setListPage(${s.page-1})">‹</button>
   ${nums}
   <button ${s.page>=pages?'disabled':''} onclick="setListPage(${s.page+1})">›</button>
  </div>
 </div>`;
}
function pageWindow(cur,pages){
 if(pages<=7)return Array.from({length:pages},(_,i)=>i+1);
 const out=[1];
 if(cur>3)out.push('…');
 for(let p=Math.max(2,cur-1);p<=Math.min(pages-1,cur+1);p++)out.push(p);
 if(cur<pages-2)out.push('…');
 out.push(pages);
 return out;
}

 if(view==='platform')return `<tr ${cl}><td><span class="cell-link">${r.name}</span></td><td>${r.desc}</td><td><span class="count">${(r.keys||[]).length}</span></td><td>${r.created}</td></tr>`;
 if(view==='history')return `<tr><td>${r.time}</td><td>${r.actor}</td><td>${escHtml(r.object||'')}</td><td><code class="res-code">${escHtml(r.sourceId||'')}</code></td><td class="strong col-action">${escHtml(r.action)}</td></tr>`;
 return '';

function inlinePager(total,page,pageSize,gotoFn){
 const pages=Math.max(1,Math.ceil(total/pageSize)||1);
 page=Math.min(Math.max(1,page),pages);
 const btns=Array.from({length:pages},(_,n)=>{
  const p=n+1;
  return `<button class="${p===page?'active':''}" onclick="${gotoFn}(${p})">${p}</button>`;
 }).join('');
 return `<div class="pager"><span>${t('pagerTotal',{n:total,from:total?(page-1)*pageSize+1:0,to:Math.min(total,page*pageSize)})} · ${t('perPage',{n:pageSize})}</span>
  <div class="pager-nav">
   <button ${page<=1?'disabled':''} onclick="${gotoFn}(${page-1})">‹</button>
   ${btns}
   <button ${page>=pages?'disabled':''} onclick="${gotoFn}(${page+1})">›</button>
  </div></div>`;
}

function switchView(v){

}
function syncNav(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));}

/* ---- hash routing: deep links are shareable and browser back/forward works ---- */
let routing=false, navDepth=0; /* how many history entries this session pushed */
function setHash(h){
 if(location.hash===h)return;
 routing=true;location.hash=h;navDepth++;
 requestAnimationFrame(()=>{routing=false;});
}
function route(){
 const parts=(location.hash||'').replace(/^#\/?/,'').split('/').filter(Boolean);
 const v=VIEWS[parts[0]]?parts[0]:'module';
 currentView=v;syncNav(v);
 if(v==='platform'&&parts[1]){
  const ui=DATA.platform.findIndex(r=>r.id===parts[1]);
  if(ui>=0){
   if(parts[2]){
    const ki=(DATA.platform[ui].keys||[]).findIndex(k=>k.id===parts[2]);
    if(ki>=0){goPlatAk(ui,ki);return;}
   }
   if(renderDetail('platform',ui))return;
  }
 }
 if(parts[1]){
  const i=DATA[v].findIndex(r=>r.id===parts[1]);
  if(i>=0&&renderDetail(v,i))return;
 }
 render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(!routing)route();});

/* ---- transient feedback ---- */
function toast(msg,kind){
 let wrap=$('#toasts');
 if(!wrap){wrap=document.createElement('div');wrap.id='toasts';wrap.className='toasts';document.body.appendChild(wrap);}
 const el=document.createElement('div');
 el.className=`toast${kind?' '+kind:''}`;
 el.innerHTML=`<span class="dot"></span><span>${msg}</span>`;
 wrap.appendChild(el);
 setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),240);},2200);
}
function copyText(el,text){
 const done=()=>{
  const label=el.querySelector('span'), old=label?label.textContent:'';
  if(label){label.textContent=t('copied');setTimeout(()=>{label.textContent=old;},1600);}
  toast(t('copiedClip'),'ok');
 };
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,done);
 else done();
}

let lastFocus=null;
function openModal(key,arg){
 const m=MODALS()[key];if(!m)return;
 const title=typeof m.title==='function'?m.title(arg):m.title;
 const body=typeof m.body==='function'?m.body(arg):m.body;
 const foot=m.foot?(typeof m.foot==='function'?m.foot(arg):m.foot)
   :btn(t('cancel'),'btn-tertiary','','closeModal()')+btn(t('save'),'btn-primary','',`saveModal(${JSON.stringify(title)})`);
 lastFocus=document.activeElement;
 $('#overlay').innerHTML=`<div class="modal${m.wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${title}">
  <div class="modal-head"><h3>${title}</h3>${iconBtn('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',t('close'),'closeModal()')}</div>
  <div class="modal-body">${body}</div>
  <div class="modal-foot">${foot}</div>
 </div>`;
 $('#overlay').classList.add('show');
 document.body.classList.add('modal-open');
 const first=$('#overlay').querySelector('.modal-body input:not([disabled]),.modal-body select:not([disabled]),.modal-body textarea');
 if(first){first.focus();if(first.select)first.select();}
}
function closeModal(){
 $('#overlay').classList.remove('show');
 $('#overlay').innerHTML='';
 document.body.classList.remove('modal-open');
 if(lastFocus&&lastFocus.focus)lastFocus.focus();
 lastFocus=null;
}
function saveModal(what){closeModal();toast(t('saved',{what}),'ok');}

document.addEventListener('keydown',e=>{
 const open=$('#overlay').classList.contains('show');
 if(e.key==='Escape'&&open){closeModal();return;}
 if(open)return;
 const el=document.activeElement;
 if(e.key==='/'&&!/^(INPUT|SELECT|TEXTAREA)$/.test(el?el.tagName:'')){e.preventDefault();focusSearch();}
});

/* customer / platform picker — master data is searched, not typed */
function pickSearch(type,q){
 const src=type==='platform'?PLATFORMS:CUSTOMERS;
 q=(q||'').toLowerCase();
 const hits=src.filter(c=>c.name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q)).slice(0,4);
 const who=type==='platform'?t('platform'):t('customer');
 $('#pk-list').innerHTML=hits.map(c=>`<button onclick="pickPick('${c.name}')">${c.name}<span>${c.code}</span></button>`).join('')
  ||`<button disabled><span>${t('noMatchWho',{who})}</span></button>`;
}
function pickPick(name){
 const c=CUSTOMERS.concat(PLATFORMS).find(x=>x.name===name);if(!c)return;
 $('#pk-q').value=`${c.name} · ${c.code}`;
 document.querySelectorAll('#pk-list button').forEach(b=>b.classList.toggle('on',b.textContent.startsWith(c.name)));
 const s=$('#pk-login');
 s.disabled=false;
 s.innerHTML=c.logins.map(l=>`<option>${l}</option>`).join('');
}

/* Filter permission columns / page cards by title · action · raw code */
function filterPermBoard(q){
 q=(q||'').toLowerCase().trim();
 document.querySelectorAll('#perm-board-wrap .perm-col').forEach(col=>{
  if(!q){col.hidden=false;col.querySelectorAll('.perm-page').forEach(p=>p.hidden=false);return;}
  let any=false;
  col.querySelectorAll('.perm-page').forEach(card=>{
   const hit=card.textContent.toLowerCase().includes(q);
   card.hidden=!hit;
   if(hit)any=true;
  });
  const headHit=col.querySelector('.perm-col-head')?.textContent.toLowerCase().includes(q);
  const modHit=[...col.querySelectorAll('.mod-acts')].some(m=>m.textContent.toLowerCase().includes(q));
  col.hidden=!(any||headHit||modHit);
  if(headHit||modHit)col.querySelectorAll('.perm-page').forEach(p=>p.hidden=false);
 });
}

/* ---- copy roles from another user ---- */
let copyState={target:0,source:null};
function copyCandidates(q){
 const tid=DATA.user[copyState.target]?.id;
 q=(q||'').toLowerCase().replace(/[·•]/g,' ').replace(/\s+/g,' ').trim();
 return DATA.user.filter(u=>{
  if(u.id===tid)return false;
  if(!q)return true;
  const hay=[userName(u),u.firstName,u.lastName,u.email,u.dept,u.office,u.id,u.login,...u.roles].join(' ').toLowerCase();
  return q.split(' ').every(tok=>!tok||hay.includes(tok));
 }).slice(0,8);
}
function copyUserRows(q){
 const hits=copyCandidates(q);
 if(!hits.length)return `<div class="picker-empty">${t('noCopyUser')}</div>`;
 return hits.map(u=>{
  const on=copyState.source===u.id?' on':'';
  const roles=t('nRoles',{n:u.roles.length});
  const tip=u.roles.length?` · ${u.roles.slice(0,2).join(', ')}${u.roles.length>2?'…':''}`:'';
  return `<button type="button" class="${on.trim()}" onclick="pickCopyUser('${u.id}')">
   <div class="meta"><b>${escHtml(userName(u))}</b><em>${u.email} · ${u.dept}</em><em class="roles">${roles}${tip}</em></div>
   <span>${u.id}</span>
  </button>`;
 }).join('');
}
function copyUserSearch(q){const list=$('#cp-list');if(list)list.innerHTML=copyUserRows(q);}
function pickCopyUser(id){
 copyState.source=id;
 const u=DATA.user.find(x=>x.id===id);
 if(u&&$('#cp-q'))$('#cp-q').value=`${userName(u)} · ${u.email}`;
 const list=$('#cp-list');if(list)list.innerHTML=copyUserRows('');
}
function applyCopyRoles(){
 const target=DATA.user[copyState.target];
 const source=DATA.user.find(x=>x.id===copyState.source);
 if(!target||!source){toast(t('pickSourceToast'));return;}
 if(!source.roles.length){toast(t('sourceEmptyToast'));return;}
 target.roles=[...new Set([...target.roles,...source.roles])];
 const now=new Date();
 const pad=n=>String(n).padStart(2,'0');
 const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 const stamp=`${pad(now.getDate())}-${months[now.getMonth()]}-${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
 DATA.history.unshift({
  time:stamp,actor:'it@qima.com',type:'userRole',
  action:`Copied permissions from ${userName(source)} to ${userName(target)}`,
  object:`${userName(source)} → ${userName(target)}`,
  sourceId:target.id
 });
 closeModal();
 renderDetail('user',copyState.target);
 toast(t('copiedToast',{name:userName(source),n:source.roles.length}),'ok');
}

 if(body)body.querySelectorAll('.subpane').forEach(x=>x.classList.toggle('active',x.dataset.p===tab.dataset.p));
});

document.querySelectorAll('#nav button').forEach(b=>{b.onclick=()=>switchView(b.dataset.view);});
document.documentElement.lang='en';
document.title=t('docTitle');
route();
