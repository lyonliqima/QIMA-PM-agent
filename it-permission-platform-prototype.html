<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT 权限管理平台 · 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== QSP / ACA design tokens (Figma: QSP Sandbox 2025) ===== */
:root{
  /* Neutral */
  --carbon:#191919;--seal:#737373;--smoke:#B3B3B3;--pearl:#DEDEDE;
  --line:#E6E6E6;--mist:#F0F0F0;--cloud:#F7F7F7;--white:#fff;
  --nav-active:#EAEAEA;--header-line:#D6D6D6;
  /* Accent · Pool */
  --pool-100:#E6ECFB;--pool-200:#D3DCF8;--pool-500:#4169E1;--pool-600:#1E46BD;--pool-900:#153184;
  /* Semantic */
  --kiwi-050:#EAF6F2;--kiwi-500:#00A876;--kiwi-900:#006648;
  --cherry-050:#FDEFEF;--cherry-500:#E5353D;--cherry-900:#9E141B;
  --mango-050:#FCF2E6;--mango-500:#F58F00;--mango-900:#B26309;
  /* Brand */
  --qima-red:#E4002B;--peach:#FF8261;
  /* Radii · per DS: 4 chip / 6 nav / 8 control / 16 container */
  --r-chip:4px;--r-nav:6px;--r-ctl:8px;--r-card:16px;
  --font:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,0,0,1);--dur:200ms;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*:not(textarea)::-webkit-scrollbar{width:8px;height:8px}
*:not(textarea)::-webkit-scrollbar-thumb{border-radius:8px;background:var(--pearl)}
*:not(textarea)::-webkit-scrollbar-thumb:hover{background:var(--smoke)}
body{min-height:100vh;font:400 14px/20px var(--font);color:var(--carbon);background:var(--cloud);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;background:none;border:0}

/* ===== app header · 72px ===== */
.appbar{position:sticky;z-index:900;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:var(--white);box-shadow:inset 0 -1px 0 var(--header-line)}
.appbar-l{display:flex;align-items:center;gap:16px;padding-left:4px;min-width:0}
.wordmark{display:flex;align-items:flex-end;gap:12px}
.wordmark .qima{height:20px;width:auto;display:block}
.wordmark .suffix{font:400 20px/20px var(--font);letter-spacing:2px;color:var(--pool-600)}
.appbar-r{display:flex;align-items:center;gap:16px}
.env{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border-radius:var(--r-ctl);color:var(--carbon);font:400 14px/20px var(--font);white-space:nowrap;transition:background var(--dur) var(--ease)}
.env:hover{background:var(--cloud)}
.env .dot{width:8px;height:8px;border-radius:50%;background:var(--kiwi-500)}
.env svg{width:20px;height:20px;color:var(--seal)}
.divider-v{width:1px;height:36px;background:var(--pearl)}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-ctl);color:var(--carbon);transition:background var(--dur) var(--ease)}
.iconbtn:hover{background:var(--pool-100)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--pool-100);color:var(--pool-500)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--peach);color:var(--white);display:grid;place-items:center;font:600 12px/12px var(--font);text-transform:uppercase}

/* ===== layout ===== */
.layout{display:grid;grid-template-columns:116px minmax(0,1fr);min-height:calc(100vh - 72px)}

/* left rail · icon + label, 116px */
.rail{position:sticky;top:72px;height:calc(100vh - 72px);background:var(--cloud);box-shadow:inset -1px 0 0 var(--line);padding:16px 8px;overflow-y:auto}
.rail-items{display:flex;flex-direction:column;gap:12px;align-items:center}
.rail-items button{width:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;border-radius:var(--r-nav);color:var(--seal);font:400 12px/16px var(--font);text-align:center;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.rail-items button svg{width:16px;height:16px;flex:none}
.rail-items button:hover{background:var(--mist);color:var(--carbon)}
.rail-items button.active{background:var(--nav-active);color:var(--carbon)}

.col{min-width:0;display:flex;flex-direction:column;background:var(--white)}

/* ===== page bar (sticky under app header) ===== */
.pagebar{position:sticky;top:72px;z-index:100;background:var(--white);box-shadow:inset 0 -1px 0 var(--line);padding:12px 24px}
.pagebar-row{display:flex;align-items:center;gap:8px;min-height:36px}
.pagebar h1{font:600 16px/20px var(--font);color:var(--carbon);white-space:nowrap}
.pagebar .grow{flex:1;min-width:0}
.pagebar .tools{display:flex;align-items:center;gap:8px}
.crumbs{display:flex;align-items:center;gap:12px;font:400 16px/20px var(--font);color:var(--carbon);min-width:0}
.crumbs .sep{color:var(--carbon)}
.crumbs .cur{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs a{color:var(--carbon);text-decoration:none;cursor:pointer}
.crumbs a:hover{color:var(--pool-500)}
.counter{position:relative;display:inline-flex}
.counter[data-n]::after{content:attr(data-n);position:absolute;z-index:1;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pool-500);color:var(--white);font:400 11px/18px var(--font);text-align:center;box-shadow:0 0 0 2px var(--white)}

/* ===== tabs (used by in-card sub tabs) ===== */
.tab{padding:8px 12px;font:400 14px/20px var(--font);color:var(--seal);border-bottom:2px solid transparent;transition:color var(--dur) var(--ease)}
.tab:hover{color:var(--carbon)}
.tab.active{color:var(--carbon);border-bottom-color:var(--pool-500)}

/* ===== buttons · h36 / r8 / 14px regular ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:8px 16px;border-radius:var(--r-ctl);background:var(--white);border:1px solid var(--pearl);color:var(--carbon);font:400 14px/20px var(--font);white-space:nowrap;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.btn:hover{background:var(--cloud)}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--pool-500);border-color:var(--pool-500);color:var(--white)}
.btn-primary:hover{background:var(--pool-600);border-color:var(--pool-600)}
.btn-secondary{background:var(--pool-100);border-color:transparent;color:var(--pool-500);padding:8px 12px}
.btn-secondary:hover{background:var(--pool-200)}
.btn-tertiary{background:transparent;border-color:transparent;color:var(--pool-500);padding:8px 12px}
.btn-tertiary:hover{background:var(--pool-100)}
.btn-danger{background:var(--cherry-050);border-color:transparent;color:var(--cherry-900);padding:8px 12px}
.btn-danger:hover{background:#fbe2e3}
.btn-icon{width:36px;padding:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ===== fields · label 12/16 + control h36 r8 border smoke ===== */
.field{display:flex;flex-direction:column;gap:4px}
.field > label{font:400 12px/16px var(--font);color:var(--carbon)}
.field input,.field select,.field textarea{width:100%;height:36px;padding:0 16px;border:1px solid var(--smoke);border-radius:var(--r-ctl);background:var(--white);font:400 14px/20px var(--font);color:var(--carbon);outline:0}
.field select{cursor:pointer;padding-right:40px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23191919' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M6 9.5l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:20px 20px}
.field textarea{height:auto;min-height:76px;padding:8px 16px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--smoke)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pool-500);box-shadow:0 0 0 3px var(--pool-100)}
.field input:disabled{background:var(--mist);color:var(--seal)}
.field .hint{font:400 12px/16px var(--font);color:var(--seal)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px 8px}
.filterbar{margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seg{display:flex;border:1px solid var(--smoke);border-radius:var(--r-ctl);overflow:hidden;height:36px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px;font:400 14px/20px var(--font);color:var(--seal);cursor:pointer;background:var(--white);box-shadow:inset -1px 0 0 var(--pearl)}
.seg label:last-child{box-shadow:none}
.seg input{display:none}
.seg input:checked+label{background:var(--pool-100);color:var(--pool-500)}

/* ===== content ===== */
.content{flex:1;padding:20px 24px 40px;min-width:0;background:var(--white)}
/* list pages: full-bleed table, no bottom padding so pager sits flush */
.content-list{padding-bottom:0}
.table-block{margin:0 -24px}

/* ===== collapsible container card ===== */
.card{background:var(--white);border:1px solid var(--pearl);border-radius:var(--r-card);margin-bottom:16px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 16px 6px 24px;background:var(--pool-100);cursor:pointer}
.card-head .chev{width:20px;height:20px;flex:none;color:var(--pool-900);transition:transform var(--dur) var(--ease)}
.card.collapsed .card-head .chev{transform:rotate(-90deg)}
.card-head h3{flex:1;min-width:0;font:400 14px/20px var(--font);color:var(--pool-900)}
.card-head .acts{display:flex;align-items:center;gap:8px}
.card-head .acts .btn-tertiary:hover,.card-head .acts .btn-secondary:hover{background:var(--pool-200)}
.card-body{padding:16px 24px}
.card.collapsed .card-body,.card.collapsed .subtabs{display:none}
.card-body.flush{padding:0}

/* key/value */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px 24px}
.kv-item{display:flex;flex-direction:column;gap:4px;min-width:0}
.kv-item .k{font:400 12px/16px var(--font);color:var(--seal)}
.kv-item .v{font:400 14px/20px var(--font);color:var(--carbon);word-break:break-word}

/* ===== table · header 48 / row 52 ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{height:48px;padding:0 8px;background:var(--white);box-shadow:inset 0 -1px 0 var(--line);font:600 14px/20px var(--font);color:var(--carbon);text-align:left;white-space:nowrap}
thead th:first-child{padding-left:24px}
thead th:last-child{padding-right:24px}
tbody td{height:52px;padding:6px 8px;border-bottom:1px solid var(--pearl);font:400 14px/20px var(--font);color:var(--seal);vertical-align:middle}
tbody td:first-child{padding-left:24px}
tbody td:last-child{padding-right:24px}
tbody tr{transition:background var(--dur) var(--ease)}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--cloud)}
tbody tr:last-child td{border-bottom:0}
.cell-link{font:600 14px/20px var(--font);color:var(--pool-500);text-decoration:underline;text-underline-position:from-font}
.strong{font-weight:600;color:var(--carbon)}
.muted{color:var(--seal)}

/* ===== badges & chips ===== */
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);font:600 12px/16px var(--font);color:var(--pool-500);white-space:nowrap}
.badge-kiwi{color:var(--kiwi-900);background:var(--kiwi-050);border-color:#BFE3D8}
.badge-cherry{color:var(--cherry-900);background:var(--cherry-050);border-color:#F5CACC}
.badge-mango{color:var(--mango-900);background:var(--mango-050);border-color:#F3DBB9}
.badge-grey{color:var(--seal);background:var(--mist);border-color:var(--pearl)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.count{display:inline-flex;align-items:center;justify-content:center;height:20px;min-width:24px;padding:0 6px;border-radius:var(--r-chip);background:var(--mist);font:400 12px/16px var(--font);color:var(--carbon)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);font:400 12px/16px var(--font);color:var(--carbon);white-space:nowrap}
.chip .x{color:var(--seal);cursor:pointer;font-size:14px;line-height:1}
.chip .x:hover{color:var(--cherry-500)}
.chip-link{color:var(--pool-500);cursor:pointer;font-weight:600}
.chip-link:focus-visible,.chip-add:focus-visible{outline:2px solid var(--pool-500);outline-offset:2px}
.chip-add{border-style:dashed;border-color:var(--pool-200);background:var(--pool-100);color:var(--pool-500);cursor:pointer}
.chip-add:hover{background:var(--pool-200)}

/* ===== pagination · h56 ===== */
.pager{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;padding:0 24px;box-shadow:inset 0 1px 0 var(--line);font:400 14px/20px var(--font);color:var(--seal)}
.pager-nav{display:flex;align-items:center;gap:4px}
.pager-nav button{min-width:32px;height:32px;padding:0 8px;border-radius:var(--r-ctl);color:var(--carbon);font:400 14px/20px var(--font)}
.pager-nav button:hover{background:var(--pool-100)}
.pager-nav button.active{background:var(--pool-500);color:var(--white)}
.pager-nav button:disabled{color:var(--smoke);cursor:not-allowed}
.pager-nav button:disabled:hover{background:none}

/* ===== sub tabs inside a card ===== */
.subtabs{display:flex;align-items:center;gap:0;padding:0 24px;box-shadow:inset 0 -1px 0 var(--line);overflow-x:auto}
.subpane{display:none}
.subpane.active{display:block}

/* ===== timeline ===== */
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--pearl)}
.tl-item{position:relative;padding:0 0 16px 8px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--white);border:2px solid var(--pool-500)}
.tl-time{font:400 12px/16px var(--font);color:var(--seal)}
.tl-act{font:600 14px/20px var(--font);color:var(--carbon);margin:2px 0}
.tl-meta{font:400 12px/16px var(--font);color:var(--seal)}

/* ===== resource tree ===== */
.tree{font:400 14px/20px var(--font)}
.tree .row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-nav);cursor:pointer;color:var(--carbon)}
.tree .row:hover{background:var(--cloud)}
.tree .caret{width:14px;color:var(--seal)}
.tree-children{margin-left:11px;padding-left:12px;box-shadow:inset 1px 0 0 var(--pearl)}

/* ===== modal ===== */
.overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:64px 16px;background:rgba(25,25,25,.42);overflow-y:auto}
.overlay.show{display:flex}
.modal{width:100%;max-width:600px;background:var(--white);border-radius:var(--r-card);overflow:hidden;box-shadow:0 8px 32px rgba(25,25,25,.2)}
.modal-head{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px 10px 24px;box-shadow:inset 0 -1px 0 var(--line)}
.modal-head h3{flex:1;font:600 16px/20px var(--font);color:var(--carbon)}
.modal-body{padding:20px 24px;max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 24px;box-shadow:inset 0 1px 0 var(--line)}
.note{padding:12px 16px;border-radius:var(--r-ctl);background:var(--pool-100);color:var(--pool-900);font:400 12px/18px var(--font)}
/* lazy-loaded section placeholder — heavy sections stay collapsed until opened */
.skel{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.skel i{display:block;height:12px;border-radius:4px;background:linear-gradient(90deg,var(--mist),var(--cloud),var(--mist));background-size:200% 100%;animation:sh 1.1s linear infinite}
.skel i:nth-child(2){width:72%}.skel i:nth-child(3){width:48%}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* search-select: master data lives in another service, so pick, never type freely */
.picker{position:relative}
.picker-list{margin-top:6px;border:1px solid var(--smoke);border-radius:var(--r-ctl);overflow:hidden;max-height:200px;overflow-y:auto}
.picker-list button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 16px;background:var(--white);border:0;cursor:pointer;text-align:left;font:400 14px/20px var(--font);color:var(--carbon)}
.picker-list button+button{box-shadow:inset 0 1px 0 var(--line)}
.picker-list button:hover{background:var(--pool-050,#F5F8FF)}
.picker-list button span{color:var(--seal);font:400 12px/16px var(--font);margin-left:auto}
.picker-list button.on{background:var(--pool-100);color:var(--pool-900)}
.picker-list button .meta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.picker-list button .meta b{font:600 14px/20px var(--font);color:inherit}
.picker-list button .meta em{font:400 12px/16px var(--font);color:var(--seal);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker-list button .meta .roles{color:var(--pool-500)}
.picker-empty{padding:16px;text-align:center;color:var(--seal);font:400 13px/18px var(--font)}
#cp-preview{min-height:28px}
.secret{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--smoke);border-radius:var(--r-ctl);background:var(--cloud);font:400 13px/20px var(--mono,var(--font));color:var(--carbon);word-break:break-all}
.secret button{margin-left:auto;flex:none}

/* ===== empty ===== */
.empty{padding:48px 24px;text-align:center;color:var(--seal);font:400 14px/20px var(--font)}

/* list table: header sticks under the page bar while scrolling long lists.
   sticky resolves against the nearest scrollport, so the list table must not
   create its own overflow container — the page scrolls instead. */
.content-list .table-wrap{overflow:visible}
.content-list thead th{position:sticky;z-index:5;top:var(--sticky-top,132px)}
th.sortable{cursor:pointer;user-select:none;transition:color var(--dur) var(--ease)}
th.sortable:hover{color:var(--pool-500)}
th .sort-ind{margin-left:6px;font-size:11px;color:var(--smoke)}
th.sorted{color:var(--pool-500)}
th.sorted .sort-ind{color:var(--pool-500)}
tbody tr.clickable:focus-visible{outline:2px solid var(--pool-500);outline-offset:-2px;background:var(--cloud)}

/* pagination extras */
.pager-left{display:flex;align-items:center;gap:12px;min-width:0}
.pg-size{height:32px;padding:0 28px 0 8px;border:1px solid var(--pearl);border-radius:var(--r-ctl);background:var(--white);color:var(--carbon);font:400 14px/20px var(--font);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23191919' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M6 9.5l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center;background-size:16px 16px}
.pager-nav .ellipsis{min-width:24px;text-align:center;color:var(--smoke)}

/* checkbox list (column settings) */
.checks{display:grid;gap:10px}
.checks label{display:flex;align-items:center;gap:10px;font:400 14px/20px var(--font);color:var(--carbon);cursor:pointer}
.checks input{width:16px;height:16px;accent-color:var(--pool-500)}

/* ===== toast ===== */
.toasts{position:fixed;z-index:1200;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:560px;padding:10px 16px;border-radius:var(--r-ctl);background:var(--carbon);color:var(--white);font:400 14px/20px var(--font);box-shadow:0 6px 24px rgba(25,25,25,.24);animation:toast-in var(--dur) var(--ease);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--pool-500);flex:none}
.toast.ok .dot{background:var(--kiwi-500)}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.modal-open{overflow:hidden}

/* ===== narrow screens ===== */
@media (max-width:1100px){
  .layout{grid-template-columns:64px minmax(0,1fr)}
  .rail-items button{width:48px;gap:0;padding:12px 0;font-size:0}
  .rail-items button svg{width:20px;height:20px}
  .grid-2{grid-template-columns:1fr}
  .env{max-width:220px;overflow:hidden}
}
@media (max-width:760px){
  .appbar{padding:12px 16px}
  .pagebar,.content{padding-left:16px;padding-right:16px}

/* ================= helpers ================= */
function btn(label,cls,svg,fn){
 return `<button class="btn ${cls||''}"${fn?` onclick="${fn}"`:''}>${svg||''}${label?`<span>${label}</span>`:''}</button>`;
}
function iconBtn(svg,title,fn,cls){
 return `<button class="iconbtn ${cls||''}" title="${title}" aria-label="${title}"${fn?` onclick="${fn}"`:''}>${svg}</button>`;
}
function kv(k,v){return `<div class="kv-item"><div class="k">${k}</div><div class="v">${v}</div></div>`;}
function field(label,control,hint){return `<div class="field"><label>${label}</label>${control}${hint?`<div class="hint">${hint}</div>`:''}</div>`;}
function idxOf(view,r){return DATA[view].indexOf(r);}

function isoBadge(v){return !v||v==='None'?'<span class="badge badge-grey">无</span>':`<span class="badge badge-mango">${v}</span>`;}
function statusBadge(s){return s==='Active'?'<span class="badge badge-kiwi"><span class="dot"></span>Active</span>':'<span class="badge badge-cherry"><span class="dot"></span>Suspended</span>';}
function modeBadge(m){return m==='inherit'?'<span class="badge">inherit</span>':'<span class="badge badge-mango">direct</span>';}

/* ================= page bar ================= */
function listPagebar(view){
 const cfg=VIEWS[view], n=activeFilterCount(view);
 return `<div class="pagebar">
  <div class="pagebar-row">
    <h1>${cfg.title}</h1>
    <span class="count" id="list-count">${visibleRows(view).length}</span>
    <div class="grow"></div>
    <div class="tools">
      ${iconBtn(SVG.search,'搜索（/）',`focusSearch()`)}
      ${iconBtn(SVG.erase,'重置筛选',`resetFilters()`)}
      ${iconBtn(SVG.columns,'列设置',`openModal('columns')`)}
      ${iconBtn(SVG.download,'导出当前结果',`exportList()`)}
      <span class="counter" id="filter-counter"${n?` data-n="${n}"`:''}>${iconBtn(SVG.filter,'筛选',`toggleFilters()`,showFilters?'on':'')}</span>
      ${listAction(view)}
    </div>
  </div>
 </div>`;
}

function listAction(view){
 if(view==='module')return btn('新建功能域','btn-primary',SVG.plus,`openModal('moduleCreate')`);
 if(view==='role')return btn('新建角色','btn-primary',SVG.plus,`openModal('roleCreate')`);
 if(view==='customer')return btn('创建客户 AccessKey','btn-primary',SVG.plus,`openModal('akCreate','customer')`);
 if(view==='platform')return btn('创建平台 AccessKey','btn-primary',SVG.plus,`openModal('akCreate','platform')`);
 return '';
}

function detailPagebar(view,r){
 return `<div class="pagebar">
  <div class="pagebar-row">
    ${btn('Back','btn-tertiary',SVG.back,`backToList()`)}
    <div class="crumbs">
      <span class="sep">/</span><a onclick="backToList()">${VIEWS[view].title}</a>
      <span class="sep">/</span><span class="cur">${detailTitle(view,r)}</span>
    </div>
    <div class="grow"></div>
    <div class="tools">${detailStatus(view,r)}${detailPrimary(view,r)}</div>
  </div>
 </div>`;
}
function detailTitle(view,r){return view==='customer'||view==='platform'?r.id:r.name;}
function detailStatus(view,r){return (view==='customer'||view==='platform')?statusBadge(r.status):'';}
function detailPrimary(view,r){
 if(view==='user')return btn('从他人复制','btn-secondary',SVG.copy,`openModal('copyRoles',${idxOf(view,r)})`)+btn('编辑用户角色','btn-primary',SVG.edit,`openModal('userRole',${idxOf(view,r)})`);
 if(view==='module')return btn('管理资源','btn-primary',SVG.link,`openModal('resourceManage','module')`);
 if(view==='role')return btn('绑定资源','btn-primary',SVG.link,`openModal('bindWeb',${idxOf(view,r)})`);
 if(view==='customer'||view==='platform')return r.mode==='inherit'
   ?btn('编辑 AccessKey','btn-primary',SVG.edit,`openModal('akEdit',${idxOf(view,r)})`)
   :btn('绑定资源','btn-primary',SVG.link,`openModal('akBind',${idxOf(view,r)})`);
 return '';
}

/* ================= list state ================= */
const LIST_STATE={};
function st(view){return LIST_STATE[view]||(LIST_STATE[view]={page:1,size:10,q:'',sort:null,filters:{},hidden:[]});}

const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
/* '23-Jul-2026 14:32' / '12-May-2026' → sortable + comparable number */
function dnum(s){
 if(!s)return 0;
 const [d,t]=String(s).split(' ');
 const [dd,mm,yy]=d.split('-');
 const [hh,mi]=(t||'0:0').split(':');
 return new Date(+yy,MONTHS[mm]||0,+dd,+hh||0,+mi||0).getTime();
}

/* column order must match listRow() cell order */
const COLS={
 module:[{k:'id',label:'功能域 ID'},{k:'name',label:'名称'},{k:'desc',label:'描述',sort:false},{k:'roles',label:'角色'},{k:'resources',label:'资源'},{k:'isolation',label:'数据隔离'}],
 role:[{k:'name',label:'角色 Key'},{k:'module',label:'功能域'},{k:'desc',label:'描述',sort:false},{k:'web',label:'Web'},{k:'api',label:'API'},{k:'data',label:'数据隔离'}],
 user:[{k:'id',label:'用户 ID'},{k:'name',label:'姓名'},{k:'email',label:'邮箱'},{k:'dept',label:'部门'},{k:'roles',label:'角色数',get:r=>r.roles.length}],
 customer:[{k:'id',label:'AccessKey ID'},{k:'client',label:'客户名称'},{k:'login',label:'登录账号'},{k:'mode',label:'模式'},{k:'status',label:'状态'},{k:'created',label:'创建日期',get:r=>dnum(r.created)}],
 platform:[{k:'id',label:'AccessKey ID'},{k:'client',label:'平台名称'},{k:'login',label:'登录账号'},{k:'mode',label:'模式'},{k:'status',label:'状态'},{k:'created',label:'创建日期',get:r=>dnum(r.created)}],
 history:[{k:'time',label:'时间',get:r=>dnum(r.time)},{k:'actor',label:'操作人'},{k:'act',label:'操作',sort:false},{k:'meta',label:'对象',sort:false}]
};

const AK_FILTERS=[
 {k:'status',label:'状态',opts:['Active','Suspended'],test:(r,v)=>r.status===v},
 {k:'mode',label:'模式',opts:['inherit','direct'],test:(r,v)=>r.mode===v}
];
const HIST_TYPE={'模块':/功能域/,'角色':/角色/,'用户角色':/用户/,'AccessKey':/AccessKey/};
const FILTERS={
 module:[{k:'isolation',label:'数据隔离维度',opts:['Site','Site · labCode','Site · Department','Site · labCode · Department'],test:(r,v)=>r.isolation===v}],
 role:[{k:'module',label:'功能域',opts:DATA.module.map(m=>m.name),test:(r,v)=>r.module===v},
  {k:'data',label:'数据隔离',opts:['已配置','未配置'],test:(r,v)=>v==='已配置'?!!r.data:!r.data}],
 user:[{k:'dept',label:'部门',opts:['Lab'],test:(r,v)=>r.dept===v},
  {k:'hasRole',label:'角色数',opts:['有角色','无角色'],test:(r,v)=>v==='有角色'?r.roles.length>0:r.roles.length===0}],
 customer:AK_FILTERS,
 platform:AK_FILTERS,
 history:[{k:'from',label:'起始日期',type:'date',test:(r,v)=>dnum(r.time)>=new Date(v+'T00:00:00').getTime()},
  {k:'to',label:'结束日期',type:'date',test:(r,v)=>dnum(r.time)<=new Date(v+'T23:59:59').getTime()},
  {k:'actor',label:'操作人',opts:[...new Set(DATA.history.map(h=>h.actor))],test:(r,v)=>r.actor===v},
  {k:'type',label:'对象类型',opts:Object.keys(HIST_TYPE),test:(r,v)=>(HIST_TYPE[v]||/.*/).test(r.act)}]
};

function visibleRows(view){
 const s=st(view), defs=FILTERS[view]||[], q=s.q.trim().toLowerCase();
 let rows=DATA[view].filter(r=>{
  if(q&&!JSON.stringify(r).toLowerCase().includes(q))return false;
  return defs.every(d=>{const v=s.filters[d.k];return v?d.test(r,v):true;});
 });
 if(s.sort){
  const c=(COLS[view]||[]).find(x=>x.k===s.sort.k);
  if(c){
   const val=r=>c.get?c.get(r):r[c.k];
   rows=rows.slice().sort((a,b)=>{
    const x=val(a),y=val(b);
    const n=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'zh-Hans-CN');
    return s.sort.dir==='desc'?-n:n;
   });
  }
 }
 return rows;
}
function activeFilterCount(view){
 const s=st(view);
 return (s.q.trim()?1:0)+Object.values(s.filters).filter(Boolean).length;
}

/* ================= list ================= */
function render(){
 pagebar.innerHTML=listPagebar(currentView);
 content.className='content content-list';
 content.innerHTML=filterCard(currentView)+colStyle(currentView)+`<div id="list-body">${listBody(currentView)}</div>`;
 syncSticky();
}
/* re-render only the table + pager so filter inputs keep focus and caret */
function refreshList(){
 const el=$('#list-body');
 if(!el)return render();
 el.innerHTML=listBody(currentView);
 const c=$('#list-count');if(c)c.textContent=visibleRows(currentView).length;
 const fc=$('#filter-counter');
 if(fc){const n=activeFilterCount(currentView);n?fc.dataset.n=n:delete fc.dataset.n;}
 const cs=$('#col-style');if(cs)cs.outerHTML=colStyle(currentView);
 syncSticky();
}

function setQuery(v){const s=st(currentView);s.q=v;s.page=1;refreshList();}
function setFilter(k,v){const s=st(currentView);s.filters[k]=(v&&v!=='全部')?v:'';if(!s.filters[k])delete s.filters[k];s.page=1;refreshList();}
function setListPage(p){const s=st(currentView);s.page=p;refreshList();$('#list-body').scrollIntoView({block:'start',behavior:'smooth'});}
function setListSize(n){const s=st(currentView);s.size=+n;s.page=1;refreshList();}
function setSort(k){
 const s=st(currentView);
 s.sort=(s.sort&&s.sort.k===k)?(s.sort.dir==='asc'?{k,dir:'desc'}:null):{k,dir:'asc'};
 refreshList();
}
function toggleColumn(k,on){
 const s=st(currentView);
 s.hidden=on?s.hidden.filter(x=>x!==k):[...new Set([...s.hidden,k])];
 refreshList();
}
function colStyle(view){
 const s=st(view), cols=COLS[view]||[];
 const rules=s.hidden.map(k=>cols.findIndex(c=>c.k===k)).filter(n=>n>=0)
  .map(n=>`#list-body th:nth-child(${n+1}),#list-body td:nth-child(${n+1}){display:none}`).join('');
 return `<style id="col-style">${rules}</style>`;
}

function filterCard(view){
 if(!showFilters)return '';
 const s=st(view), defs=FILTERS[view]||[];
 const ctrl=d=>d.type==='date'
  ?`<input type="date" value="${s.filters[d.k]||''}" onchange="setFilter('${d.k}',this.value)">`
  :`<select onchange="setFilter('${d.k}',this.value)">${['全部',...d.opts].map(o=>`<option${(s.filters[d.k]||'全部')===o?' selected':''}>${o}</option>`).join('')}</select>`;
 return `<div class="filterbar"><div class="filters">
   ${field('关键字',`<input id="q" placeholder="Type to search..." value="${s.q}" oninput="setQuery(this.value)">`)}
   ${defs.map(d=>field(d.label,ctrl(d))).join('')}
 </div></div>`;
}

function listBody(view){
 const s=st(view), rows=visibleRows(view);
 const pages=Math.max(1,Math.ceil(rows.length/s.size));
 if(s.page>pages)s.page=pages;
 const slice=rows.slice((s.page-1)*s.size,s.page*s.size);
 return `<div class="table-block"><div class="table-wrap">${listTable(view,slice)}</div>${listPager(view,rows.length,pages)}</div>`;
}

function listTable(view,rows){
 const cols=COLS[view];
 const body=rows.length
  ?rows.map(r=>listRow(view,r,DATA[view].indexOf(r))).join('')
  :`<tr><td colspan="${cols.length}"><div class="empty">未找到匹配记录${activeFilterCount(view)?`<div style="margin-top:16px">${btn('清除筛选条件','btn-secondary',SVG.erase,'resetFilters()')}</div>`:''}</div></td></tr>`;
 return `<table><thead>${listHead(view)}</thead><tbody id="tbody">${body}</tbody></table>`;
}

function listHead(view){
 const s=st(view);
 return `<tr>${COLS[view].map(c=>{
  if(c.sort===false)return `<th>${c.label}</th>`;
  const on=s.sort&&s.sort.k===c.k;
  return `<th class="sortable${on?' sorted':''}" onclick="setSort('${c.k}')">${c.label}<span class="sort-ind">${on?(s.sort.dir==='asc'?'↑':'↓'):'↕'}</span></th>`;
 }).join('')}</tr>`;
}

function listPager(view,total,pages){
 const s=st(view);
 const nums=pageWindow(s.page,pages).map(p=>p==='…'
  ?'<span class="ellipsis">…</span>'
  :`<button class="${p===s.page?'active':''}" onclick="setListPage(${p})">${p}</button>`).join('');
 const from=total?(s.page-1)*s.size+1:0, to=Math.min(total,s.page*s.size);
 return `<div class="pager">
  <div class="pager-left">
   <span>共 ${total} 条${total?` · 显示 ${from}-${to}`:''}</span>
   <select class="pg-size" onchange="setListSize(this.value)">${[10,20,50].map(n=>`<option value="${n}"${n===s.size?' selected':''}>每页 ${n} 条</option>`).join('')}</select>
  </div>
  <div class="pager-nav">
   <button ${s.page<=1?'disabled':''} onclick="setListPage(${s.page-1})">‹</button>
   ${nums}
   <button ${s.page>=pages?'disabled':''} onclick="setListPage(${s.page+1})">›</button>
  </div>
 </div>`;
}
function pageWindow(cur,pages){
 if(pages<=7)return Array.from({length:pages},(_,i)=>i+1);
 const out=[1];
 if(cur>3)out.push('…');
 for(let p=Math.max(2,cur-1);p<=Math.min(pages-1,cur+1);p++)out.push(p);
 if(cur<pages-2)out.push('…');
 out.push(pages);
 return out;
}

function listRow(view,r,i){
 const cl=`class="clickable" tabindex="0" data-idx="${i}" onclick="goDetail('${view}',${i})" onkeydown="rowKey(event,'${view}',${i})"`;
 if(view==='module')return `<tr ${cl}><td><span class="cell-link">${r.id}</span></td><td class="strong">${r.name}</td><td>${r.desc}</td><td><span class="count">${r.roles}</span></td><td><span class="count">${r.resources}</span></td><td>${isoBadge(r.isolation)}</td></tr>`;
 if(view==='role')return `<tr ${cl}><td><span class="cell-link">${r.name}</span></td><td class="strong">${r.module}</td><td>${r.desc}</td><td><span class="count">${r.web}</span></td><td><span class="count">${r.api}</span></td><td>${r.data?'<span class="badge badge-mango"><span class="dot"></span>已配置</span>':'<span class="badge badge-grey">无</span>'}</td></tr>`;
 if(view==='user')return `<tr ${cl}><td><span class="cell-link">${r.id}</span></td><td class="strong">${r.name}</td><td>${r.email}</td><td>${r.dept}</td><td>${r.roles.length?`<span class="count">${r.roles.length}</span>`:'<span class="badge badge-grey">0</span>'}</td></tr>`;
 if(view==='customer'||view==='platform')return `<tr ${cl}><td><span class="cell-link">${r.id}</span></td><td class="strong">${r.client}</td><td>${r.login}</td><td>${modeBadge(r.mode)}</td><td>${statusBadge(r.status)}</td><td>${r.created}</td></tr>`;
 if(view==='history')return `<tr><td>${r.time}</td><td>${r.actor}</td><td class="strong">${r.act}</td><td>${r.meta}</td></tr>`;
 return '';
}

function inlinePager(total,page,pageSize,gotoFn){
 const pages=Math.max(1,Math.ceil(total/pageSize)||1);
 page=Math.min(Math.max(1,page),pages);
 const btns=Array.from({length:pages},(_,n)=>{
  const p=n+1;
  return `<button class="${p===page?'active':''}" onclick="${gotoFn}(${p})">${p}</button>`;
 }).join('');
 return `<div class="pager"><span>共 ${total} 条 · 每页 ${pageSize} 条</span>
  <div class="pager-nav">
   <button ${page<=1?'disabled':''} onclick="${gotoFn}(${page-1})">‹</button>
   ${btns}
   <button ${page>=pages?'disabled':''} onclick="${gotoFn}(${page+1})">›</button>
  </div></div>`;
}

/* ================= detail ================= */
function renderDetail(view,i){
 const r=DATA[view][i];
 if(!r||view==='history')return false;
 pagebar.innerHTML=detailPagebar(view,r);
 content.className='content'; /* same white canvas as list — cards separate via Pool-100 heads */
 content.innerHTML=detailBody(view,r);
 syncSticky();
 window.scrollTo(0,0);
 return true;
}
function goDetail(view,i){
 const r=DATA[view][i];
 if(!r||view==='history')return;
 setHash(`#/${view}/${r.id}`);
 renderDetail(view,i);
}
/* prefer real history so Back and the browser button behave the same, but never
   step outside the prototype when the detail page was opened by a deep link */
function backToList(){
 if(navDepth>0){navDepth--;history.back();return;}
 setHash(`#/${currentView}`);navDepth=0;
 render();window.scrollTo(0,0);
}
function rowKey(e,view,i){
 if(e.key==='Enter'||e.key===' '){e.preventDefault();goDetail(view,i);}
}

/* keep the sticky list header parked right under the page bar */
function syncSticky(){
 const pb=pagebar.querySelector('.pagebar');
 document.documentElement.style.setProperty('--sticky-top',`${72+(pb?pb.offsetHeight:60)}px`);
}
window.addEventListener('resize',syncSticky);

function card(title,acts,body,subtabs,opt){
 opt=opt||{};
 const html=body.html!==undefined?body.html:body;
 return `<div class="card${opt.lazy?' collapsed':''}"${opt.lazy?' data-lazy="1"':''}>
  <div class="card-head" onclick="toggleCard(this)">${SVG.chev}<h3>${title}</h3>${acts?`<div class="acts" onclick="event.stopPropagation()">${acts}</div>`:''}</div>
  ${subtabs||''}
  <div class="card-body${body.flush?' flush':''}">${opt.lazy?`<div class="skel"><i></i><i></i><i></i></div><template>${html}</template>`:html}</div>
 </div>`;
}
function subtabs(items){
 return `<div class="subtabs">${items.map((t,i)=>`<button class="tab${i===0?' active':''}" data-p="${t.p}">${t.label}</button>`).join('')}</div>`;
}

function detailBody(view,r){
 if(view==='module')return moduleDetail(r);
 if(view==='role')return roleDetail(r);
 if(view==='user')return userDetail(r);
 return akDetail(view,r);
}

function moduleDetail(r){
 const i=idxOf('module',r);
 const roleRows=DATA.role.filter(x=>x.module===r.name);
 const res=LAB_RESOURCES[r.id]||{web:[],api:[]};
 const webChips=res.web.slice(0,8).map(c=>`<span class="chip">${c}</span>`).join('')
  +`<span class="chip chip-add" onclick="openModal('resourceManage','module')">${SVG.plus.replace('<svg','<svg style="width:14px;height:14px"')}添加资源</span>`;
 const apiChips=(res.api.length?res.api:['（本域主要为 PAGE/BUTTON 资源）']).map(c=>`<span class="chip">${c}</span>`).join('')
  +`<span class="chip chip-add" onclick="openModal('resourceManage','module')">添加 API</span>`;
 return card('模块信息',btn('编辑','btn-secondary',SVG.edit,`openModal('moduleEdit',${i})`),
   `<div class="kv">${kv('功能域 ID',r.id)}${kv('名称',r.name)}${kv('auth2 Module','lab-service-cloud')}${kv('描述',r.desc)}${kv('数据隔离维度',isoBadge(r.isolation))}</div>`)
 + card('关联资源',
   btn('管理资源','btn-secondary',SVG.link,`openModal('resourceManage','module')`),
   {html:`
     <div class="subpane active" data-p="web"><div class="chips">${webChips}</div></div>
     <div class="subpane" data-p="api"><div class="chips">${apiChips}</div></div>
     <div class="subpane" data-p="data">
       <div class="kv">${kv('隔离维度',isoBadge(r.isolation))}${kv('说明','按 Site / labCode / Department 限制订单与报告可见范围（业务字段含 labCodes）')}</div>
       <div style="margin-top:16px">${btn('配置数据隔离','btn-secondary',SVG.shield,`openModal('isoConfig',${i})`)}</div>
     </div>`},
   subtabs([{p:'web',label:`Web (${res.web.length})`},{p:'api',label:`API (${res.api.length})`},{p:'data',label:'Data'}]))
 + card('模块内角色',btn('管理角色','btn-secondary',SVG.edit,`openModal('roleManage')`),
   {flush:true,html:`<div class="table-wrap"><table><thead><tr><th>角色 Key</th><th>描述</th><th>Web</th><th>API</th><th>数据隔离</th></tr></thead><tbody>
     ${roleRows.map(x=>`<tr class="clickable" tabindex="0" onclick="jumpToRole('${x.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();jumpToRole('${x.id}')}"><td><span class="cell-link">${x.name}</span></td><td>${x.desc}</td><td><span class="count">${x.web}</span></td><td><span class="count">${x.api}</span></td><td>${x.data?'<span class="badge badge-mango">已配置</span>':'<span class="badge badge-grey">无</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">该模块暂无角色</td></tr>'}
   </tbody></table></div>`},'',{lazy:true});
}

const ROLE_USERS_PS=5;
let roleUsersPageState={idx:0,page:1};

function roleUsersCardHtml(r,page){
 const i=idxOf('role',r);
 const users=DATA.user.filter(u=>u.roles.includes(r.name));
 const ps=ROLE_USERS_PS;
 const pages=Math.max(1,Math.ceil(users.length/ps)||1);
 page=Math.min(Math.max(1,page||1),pages);
 roleUsersPageState={idx:i,page};
 const slice=users.slice((page-1)*ps,page*ps);
 const rows=slice.map(u=>`<tr class="clickable" tabindex="0" onclick="jumpToUser('${u.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();jumpToUser('${u.id}')}"><td><span class="cell-link">${u.name}</span></td><td>${u.email}</td><td>${u.dept}</td></tr>`).join('')
  ||'<tr><td colspan="3" class="empty">暂无授权用户</td></tr>';
 return card('已授权用户','',
  {flush:true,html:`<div class="table-wrap"><table><thead><tr><th>用户</th><th>邮箱</th><th>部门</th></tr></thead><tbody>${rows}</tbody></table></div>${inlinePager(users.length,page,ps,`setRoleUsersPage`)}`});
}

function setRoleUsersPage(page){
 const r=DATA.role[roleUsersPageState.idx];
 if(!r)return;
 const html=roleUsersCardHtml(r,page);
 const cards=[...content.querySelectorAll('.card')];
 const el=cards.find(c=>c.querySelector('.card-title')?.textContent==='已授权用户');
 if(!el)return;
 const tmp=document.createElement('div');
 tmp.innerHTML=html;
 el.replaceWith(tmp.firstElementChild);
}

function roleDetail(r){
 const i=idxOf('role',r);
 const mod=DATA.module.find(m=>m.name===r.module);
 const res=LAB_RESOURCES[mod?mod.id:'report-generation']||{web:[],api:[]};
 const webShow=res.web.slice(0,4);
 const apiShow=res.api.slice(0,3);
 return card('角色信息',btn('编辑','btn-secondary',SVG.edit,`openModal('roleEdit',${i})`),
   `<div class="kv">${kv('角色 Key',r.name)}${kv('功能域',r.module)}${kv('auth2 Module','lab-service-cloud')}${kv('描述',r.desc)}</div>`)
 + card('关联资源',

   {html:`
     <div class="subpane active" data-p="web"><div class="chips">${webShow.map(c=>`<span class="chip">${c}</span>`).join('')}<span class="chip chip-add" onclick="openModal('bindWeb',${i})">绑定 Web</span></div></div>
     <div class="subpane" data-p="api"><div class="chips">${(apiShow.length?apiShow:['（无独立 API 资源码）']).map(c=>`<span class="chip">${c}</span>`).join('')}<span class="chip chip-add" onclick="openModal('bindApi',${i})">绑定 API</span></div></div>
     <div class="subpane" data-p="data"><div class="chips">${r.data?'<span class="chip">维度：Site · labCode · Department</span><span class="chip">值：LAB001 · Softlines</span>':'<span class="muted">该角色无数据隔离</span>'}<span class="chip chip-add" onclick="openModal('bindData',${i})">配置隔离</span></div></div>`},
   subtabs([{p:'web',label:`Web (${r.web})`},{p:'api',label:`API (${r.api})`},{p:'data',label:`Data (${r.data})`}]))

}

function userDetail(r){
 const i=idxOf('user',r);
 const empty=`<div class="empty">该用户暂无权限角色<div style="margin-top:16px">${btn('从他人复制权限','btn-secondary',SVG.copy,"openModal('copyRoles',"+i+")")}</div></div>`;
 return card('用户信息','',
   `<div class="kv">${kv('用户 ID',r.id)}${kv('姓名',r.name)}${kv('邮箱',r.email)}${kv('部门',r.dept)}${kv('数据来源','User Service · 只读')}</div>`)
 + card('用户角色',
   btn('从他人复制','btn-secondary',SVG.copy,`openModal('copyRoles',${i})`)+btn('编辑角色','btn-tertiary',SVG.edit,`openModal('userRole',${i})`),
   r.roles.length?`<div class="chips">${r.roles.map(rl=>`<span class="chip chip-link" role="button" tabindex="0" onclick="jumpToRole('${rl}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();jumpToRole('${rl}')}">${rl}</span>`).join('')}</div>`:empty);
}

function akDetail(view,r){
 const i=idxOf(view,r), isPlat=view==='platform', inherit=r.mode==='inherit';
 return card('AccessKey 信息',btn('编辑','btn-secondary',SVG.edit,`openModal('akEdit',${i})`),

/* ================= interactions ================= */
function switchView(v){
 currentView=v;
 syncNav(v);
 setHash(`#/${v}`);
 render();window.scrollTo(0,0);
}
function syncNav(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));}

/* ---- hash routing: deep links are shareable and browser back/forward works ---- */
let routing=false, navDepth=0; /* how many history entries this session pushed */
function setHash(h){
 if(location.hash===h)return;
 routing=true;location.hash=h;navDepth++;
 requestAnimationFrame(()=>{routing=false;});
}
function route(){
 const parts=(location.hash||'').replace(/^#\/?/,'').split('/').filter(Boolean);
 const v=VIEWS[parts[0]]?parts[0]:'module';
 currentView=v;syncNav(v);
 if(parts[1]){
  const i=DATA[v].findIndex(r=>r.id===parts[1]);
  if(i>=0&&renderDetail(v,i))return;
 }
 render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(!routing)route();});

/* ---- transient feedback ---- */
function toast(msg,kind){
 let wrap=$('#toasts');
 if(!wrap){wrap=document.createElement('div');wrap.id='toasts';wrap.className='toasts';document.body.appendChild(wrap);}
 const el=document.createElement('div');
 el.className=`toast${kind?' '+kind:''}`;
 el.innerHTML=`<span class="dot"></span><span>${msg}</span>`;
 wrap.appendChild(el);
 setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),240);},2200);
}
function copyText(el,text){
 const done=()=>{
  const label=el.querySelector('span'), old=label?label.textContent:'';
  if(label){label.textContent='已复制';setTimeout(()=>{label.textContent=old;},1600);}
  toast('已复制到剪贴板','ok');
 };
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,done);
 else done();
}
function exportList(){
 const n=visibleRows(currentView).length;
 toast(`已导出当前筛选结果 ${n} 条 · CSV`,'ok');
}
function toggleCard(head){
 const c=head.parentElement;
 c.classList.toggle('collapsed');
 if(c.classList.contains('collapsed')||!c.dataset.lazy)return;
 delete c.dataset.lazy;
 const b=c.querySelector('.card-body'), t=b.querySelector('template');
 setTimeout(()=>{b.innerHTML=t.innerHTML;},380);
}

function resetFilters(){

 if(!activeFilterCount(currentView)&&!s.sort){toast('当前没有筛选条件');return;}
 s.q='';s.filters={};s.sort=null;s.page=1;

let lastFocus=null;
function openModal(key,arg){
 const m=MODALS[key];if(!m)return;
 const title=typeof m.title==='function'?m.title(arg):m.title;
 const body=typeof m.body==='function'?m.body(arg):m.body;
 const foot=m.foot?(typeof m.foot==='function'?m.foot(arg):m.foot)
   :btn('取消','btn-tertiary','','closeModal()')+btn('保存','btn-primary','',`saveModal('${title}')`);
 lastFocus=document.activeElement;
 $('#overlay').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${title}">
  <div class="modal-head"><h3>${title}</h3>${iconBtn('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>','关闭','closeModal()')}</div>
  <div class="modal-body">${body}</div>
  <div class="modal-foot">${foot}</div>
 </div>`;
 $('#overlay').classList.add('show');
 document.body.classList.add('modal-open');
 const first=$('#overlay').querySelector('.modal-body input:not([disabled]),.modal-body select:not([disabled]),.modal-body textarea');
 if(first){first.focus();if(first.select)first.select();}
}
function closeModal(){
 $('#overlay').classList.remove('show');
 $('#overlay').innerHTML='';
 document.body.classList.remove('modal-open');
 if(lastFocus&&lastFocus.focus)lastFocus.focus();
 lastFocus=null;
}

document.addEventListener('keydown',e=>{

 if(e.key==='Escape'&&open){closeModal();return;}
 if(open)return;
 const t=document.activeElement;
 if(e.key==='/'&&!/^(INPUT|SELECT|TEXTAREA)$/.test(t?t.tagName:'')){e.preventDefault();focusSearch();}
});

 $('#pk-list').innerHTML=hits.map(c=>`<button onclick="pickPick('${c.name}')">${c.name}<span>${c.code}</span></button>`).join('')
  ||`<button disabled><span>未找到匹配${type==='platform'?'平台':'客户'}</span></button>`;
}

/* ---- copy roles from another user ---- */
let copyState={target:0,source:null,mode:'replace'};
function copyCandidates(q){
 const tid=DATA.user[copyState.target]?.id;
 q=(q||'').toLowerCase().trim();
 return DATA.user.filter(u=>{
  if(u.id===tid)return false;
  if(!q)return true;
  return [u.name,u.email,u.dept,u.id,...u.roles].join(' ').toLowerCase().includes(q);
 }).slice(0,8);
}
function copyUserRows(q){
 const hits=copyCandidates(q);
 if(!hits.length)return `<div class="picker-empty">未找到可复制的用户</div>`;
 return hits.map(u=>{
  const on=copyState.source===u.id?' on':'';
  const roles=u.roles.length?`${u.roles.length} 个角色`:'无角色';
  return `<button type="button" class="${on.trim()}" onclick="pickCopyUser('${u.id}')">
   <div class="meta"><b>${u.name}</b><em>${u.email} · ${u.dept}</em><em class="roles">${roles}${u.roles.length?` · ${u.roles.slice(0,2).join('、')}${u.roles.length>2?'…':''}`:''}</em></div>
   <span>${u.id}</span>
  </button>`;
 }).join('');
}
function copyUserSearch(q){const list=$('#cp-list');if(list)list.innerHTML=copyUserRows(q);}
function pickCopyUser(id){
 copyState.source=id;
 const u=DATA.user.find(x=>x.id===id);
 if(u&&$('#cp-q'))$('#cp-q').value=`${u.name} · ${u.email}`;
 /* re-render full candidate list so the selection stays visible (the display
    string contains "·" which would otherwise match nobody) */
 const list=$('#cp-list');if(list)list.innerHTML=copyUserRows('');
 const p=$('#cp-preview');if(p)p.innerHTML=copyPreviewHtml();
}
function setCopyMode(m){copyState.mode=m;const p=$('#cp-preview');if(p)p.innerHTML=copyPreviewHtml();}
function copyPreviewHtml(){
 const t=DATA.user[copyState.target];
 const s=DATA.user.find(x=>x.id===copyState.source);
 if(!s)return `<div class="note" style="background:var(--mist);color:var(--seal)">先从来源列表中选择一位用户，预览将显示在此。</div>`;
 if(!s.roles.length)return `<div class="note" style="background:var(--cherry-050);color:var(--cherry-900)">${s.name} 当前没有任何角色，无法复制。</div>`;
 const keep=copyState.mode==='merge'?t.roles:[];
 const next=[...new Set([...keep,...s.roles])];
 const added=next.filter(r=>!t.roles.includes(r));
 const removed=copyState.mode==='replace'?t.roles.filter(r=>!s.roles.includes(r)):[];
 return `
  ${field('将生效的角色',`<div class="chips">${next.map(r=>`<span class="chip">${r}</span>`).join('')}</div>`)}
  <div class="kv" style="margin-top:12px">
   ${kv('新增',added.length?added.map(r=>`<span class="badge badge-kiwi">${r}</span>`).join(' ')||'—':'无')}
   ${kv(copyState.mode==='replace'?'将移除':`保留现有`,removed.length?removed.map(r=>`<span class="badge badge-cherry">${r}</span>`).join(' '):(copyState.mode==='merge'?(t.roles.length?t.roles.map(r=>`<span class="badge">${r}</span>`).join(' '):'无'):'无'))}
  </div>`;
}
function applyCopyRoles(){
 const t=DATA.user[copyState.target];
 const s=DATA.user.find(x=>x.id===copyState.source);
 if(!t||!s){toast('请先选择来源用户');return;}
 if(!s.roles.length){toast('来源用户没有可复制的角色');return;}
 const before=t.roles.slice();
 t.roles=copyState.mode==='merge'
  ?[...new Set([...t.roles,...s.roles])]
  :s.roles.slice();
 const now=new Date();
 const pad=n=>String(n).padStart(2,'0');
 const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 const stamp=`${pad(now.getDate())}-${months[now.getMonth()]}-${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
 DATA.history.unshift({time:stamp,actor:'it@qima.com',act:`从 ${s.name} 复制权限到 ${t.name}`,meta:`${copyState.mode==='replace'?'覆盖':'合并'} · ${before.length} → ${t.roles.length} 个角色`});
 closeModal();
 renderDetail('user',copyState.target);
 toast(`已${copyState.mode==='replace'?'覆盖':'合并'}复制 ${s.name} 的 ${s.roles.length} 个角色`,'ok');
}

/* sub tabs inside cards */
document.addEventListener('click',e=>{
 const st=e.target.closest('.subtabs .tab');
 if(!st)return;
 const wrap=st.parentElement;
 wrap.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 st.classList.add('active');
 const body=wrap.parentElement.querySelector('.card-body');
 if(body)body.querySelectorAll('.subpane').forEach(x=>x.classList.toggle('active',x.dataset.p===st.dataset.p));
});

document.querySelectorAll('#nav button').forEach(b=>{b.onclick=()=>switchView(b.dataset.view);});
route();
</script>
</body>
